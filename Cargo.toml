[workspace]
members = ["crates/*"]
exclude = ["legacy"]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/airframesio/xng"
authors = ["Kevin Elliott", "xng contributors"]

[workspace.dependencies]
anyhow = "1"
rumqttc = { version = "0.25", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
crc = "3"
crossbeam-channel = "0.8"
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "net", "signal", "sync", "fs", "process", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

xng-types = { path = "crates/xng-types" }
xng-dsp = { path = "crates/xng-dsp" }
xng-sdr = { path = "crates/xng-sdr" }
xng-mode-acars = { path = "crates/xng-mode-acars" }
xng-mode-ais = { path = "crates/xng-mode-ais" }
xng-mode-adsb = { path = "crates/xng-mode-adsb" }
xng-proto = { path = "crates/xng-proto" }
xng-acars = { path = "crates/xng-acars" }
xng-mode-vdl2 = { path = "crates/xng-mode-vdl2" }
xng-mode-aero = { path = "crates/xng-mode-aero" }
xng-mode-stdc = { path = "crates/xng-mode-stdc" }
xng-mode-hfdl = { path = "crates/xng-mode-hfdl" }
xng-mode-iridium = { path = "crates/xng-mode-iridium" }
prost = "0.13"
tonic = "0.12"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ratatui = "0.30"
rcgen = "0.13"
rustls-pemfile = "2"
tokio-stream = "0.1"
webpki-roots = "0.26"

# DSP loopback tests are too slow unoptimized.
[profile.test]
opt-level = 2

[package]
name = "xng"
description = "Next-generation multi-mode SDR decoder for ACARS, VDL2, HFDL, satcom, AIS, and more"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["soapy"]
soapy = ["xng-sdr/soapy"]
# Native Airspy R2/Mini support (libairspy) — no SoapyAirspy module needed.
airspy = ["xng-sdr/airspy"]
# Native Airspy HF+ / Discovery support (libairspyhf).
airspyhf = ["xng-sdr/airspyhf"]

[dependencies]
anyhow.workspace = true
rumqttc.workspace = true
toml = "0.8"
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
num-complex.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
xng-types.workspace = true
xng-dsp.workspace = true
xng-sdr.workspace = true
xng-mode-acars.workspace = true
xng-mode-ais.workspace = true
xng-mode-adsb.workspace = true
xng-proto.workspace = true
xng-acars.workspace = true
xng-mode-vdl2.workspace = true
xng-mode-aero.workspace = true
xng-mode-stdc.workspace = true
xng-mode-hfdl.workspace = true
xng-mode-iridium.workspace = true
prost.workspace = true
tonic.workspace = true
quinn.workspace = true
rustls.workspace = true
ratatui.workspace = true
rcgen.workspace = true
rustls-pemfile.workspace = true
tokio-stream.workspace = true
webpki-roots.workspace = true
