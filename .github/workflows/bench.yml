name: bench

on:
  pull_request:
  push:
    branches: [master]

jobs:
  decode-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt install -y libsoapysdr-dev protobuf-compiler
      - name: Build
        run: cargo build --release
      - name: Fetch off-air fixtures (release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download bench-fixtures-v1 -p ais_96k.cs16 -p vdl2_105k_conj.s16 -p vdl2_opflasher_105k.cs16 -p hfdl_48k.cs16 -p adsb_quiet_24m.cu8 -p acars_100k.cs16 -p sonde_96k.cf32 -p navtex_62500.cs16 -D bench/data/
      - name: Decode-count regression gate
        run: bash bench/run.sh
