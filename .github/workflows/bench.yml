name: bench

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  decode-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt install -y libsoapysdr-dev protobuf-compiler
      - name: Build
        run: cargo build --release
      - name: Fetch off-air fixtures (release assets, sha256-checked)
        run: bash bench/fetch-fixtures.sh
      - name: Decode-count regression gate
        run: bash bench/run.sh
