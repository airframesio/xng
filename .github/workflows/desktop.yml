name: Desktop

# Builds, tests and packages the desktop app (desktop/) on every platform it
# ships for. Pull requests and master pushes keep the installers as workflow
# artifacts; the Release workflow calls this one and attaches them to the
# GitHub release.
#
# macOS signing: with the APPLE_* secrets below set, master pushes, releases
# and manual runs sign the app with the Developer ID certificate and, when
# the notarization secrets are there too, notarize it. Pull requests and
# repositories without the secrets get an ad-hoc signature (Gatekeeper asks
# on first open).
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  its export password (omit if it has none)
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   notarization (app-specific password)
#
# Windows installers are unsigned (SmartScreen warns).

on:
  push:
    branches: [ "master" ]
    paths:
      - "desktop/**"
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "desktop/**"
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the .deb installs on current Debian and Ubuntu releases.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            cargo_args: --features airspy,airspyhf
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
            cargo_args: --features airspy,airspyhf
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            cargo_args: --features airspy,airspyhf
          # No SDR backend on Windows yet (same as the CLI's Windows build):
          # the app decodes IQ recordings there.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            cargo_args: --no-default-features
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libsoapysdr-dev libairspy-dev libairspyhf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # 22.04's protoc predates proto3 optional fields, which asf2.proto uses.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr airspy airspyhf protobuf
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress
      - name: Install UI dependencies
        run: npm ci
      - name: Type-check UI
        run: npm run check
      - name: Build UI
        run: npm run build
      - name: Run tests
        working-directory: desktop/src-tauri
        run: cargo test ${{ matrix.cargo_args }}
      # Tauri signs and notarizes from these variables. They are only set
      # when the secrets exist, so an empty value never replaces the ad-hoc
      # identity in tauri.conf.json.
      - name: Set up macOS signing
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "No signing certificate configured: building with an ad-hoc signature."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<XNG_EOF"
            echo "$CERT"
            echo "XNG_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          echo "Signing with the configured Developer ID certificate."
          if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
            {
              echo "APPLE_ID=$NOTARY_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM"
            } >> "$GITHUB_ENV"
            echo "Notarizing with the configured Apple ID."
          else
            echo "No notarization credentials configured: the app will be signed but not notarized."
          fi
      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }} -- ${{ matrix.cargo_args }}
      - name: Collect installers
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT="xng-desktop-${VERSION}-${{ matrix.target }}"
          mkdir -p ../dist-desktop
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/*/*.{deb,dmg,exe}; do
            cp "$f" "../dist-desktop/${OUT}.${f##*.}"
          done
          ls -l ../dist-desktop
          test -n "$(ls ../dist-desktop)"
      - name: Show macOS signature
        if: runner.os == 'macOS'
        run: |
          codesign -dvv src-tauri/target/release/bundle/macos/XNG.app 2>&1 | grep -E "Authority|TeamIdentifier|Signature|flags" || true
          spctl -a -vv src-tauri/target/release/bundle/macos/XNG.app 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.target }}
          path: dist-desktop/*
          if-no-files-found: error
