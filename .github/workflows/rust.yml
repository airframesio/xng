name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt install -y libsoapysdr-dev libairspy-dev libairspyhf-dev protobuf-compiler
    - name: Build
      run: cargo build --verbose --release --features airspy,airspyhf
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Run tests (native Airspy backends)
      run: cargo test --workspace --features airspy,airspyhf --verbose
    - name: Build Debian package
      run: ./build_deb_package.sh
    - uses: actions/upload-artifact@v4
      with:
        name: xng-debian-package-latest
        path: |
          ./build/*.deb

  # Windows: the decode core, CLI and every output build and test natively.
  # SDR hardware backends are left out here (SoapySDR on Windows comes from
  # a PothosSDR install); IQ files and stdin work.
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install protoc
      run: choco install protoc -y --no-progress
    - name: Build
      run: cargo build --verbose --release --no-default-features
    - name: Run tests
      run: cargo test --workspace --no-default-features --verbose
    - name: Self-test
      run: ./target/release/xng.exe selftest
    - uses: actions/upload-artifact@v4
      with:
        name: xng-windows-x86_64-latest
        path: ./target/release/xng.exe
