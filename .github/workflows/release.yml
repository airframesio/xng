name: Release

# Tag a version (e.g. v0.9.0) to build binaries for every supported
# platform/architecture and publish a GitHub release with the assets.

on:
  push:
    tags:
      - 'v*'
  # Pull requests that touch the Linux packaging build and verify the
  # binaries without publishing anything.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - build_deb_package.sh

permissions:
  contents: write

jobs:
  # Linux binaries and .debs are built in Ubuntu 22.04 (glibc 2.35), so they
  # run on Ubuntu 22.04+, Debian 12 and Raspberry Pi OS Bookworm. armhf
  # (32-bit Pi OS, Pi 2 and newer) is cross-compiled on amd64.
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build binary, tarball and .deb
        env:
          XNG_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'pr' }}
        run: packaging/build-linux-release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  # Install each .deb and run each tarball binary on the distributions it is
  # for. armhf runs under QEMU.
  verify-linux:
    name: Verify ${{ matrix.arch }} on ${{ matrix.image }}
    needs: build-linux
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, image: 'debian:bookworm', apt: '' }
          - { arch: amd64, platform: linux/amd64, image: 'ubuntu:22.04', apt: '' }
          - { arch: arm64, platform: linux/arm64, image: 'debian:bookworm', apt: '' }
          - { arch: arm64, platform: linux/arm64, image: 'ubuntu:22.04', apt: '' }
          # armhf runs under QEMU, where libusb from the native Airspy backend
          # plus the UHD SoapySDR module (pulled in by Recommends) crashes
          # about 1 run in 6 while enumerating; a plain C program doing the
          # same airspy_list_devices + SoapySDRDevice_enumerate crashes too.
          # Install only the declared dependencies there.
          - { arch: armhf, platform: linux/arm/v7, image: 'debian:bookworm', apt: '--no-install-recommends' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist
      - name: Set up QEMU
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3
      - name: Install the .deb and run xng
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/dist:/dist" ${{ matrix.image }} sh -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.apt }} /dist/*.deb
            xng --version
            xng devices
            mkdir /t && tar -C /t -xzf /dist/*.tar.gz && /t/*/xng --version
          '

  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # SoapySDR on Windows is linked delay-loaded: radios need a
          # PothosSDR install, everything else works without one.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            windows: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr airspy airspyhf protobuf
      - name: Install dependencies (Windows)
        if: matrix.windows
        run: choco install protoc -y --no-progress
      - name: Install PothosSDR (Windows)
        if: matrix.windows
        uses: ./.github/actions/pothossdr
      # `sherpa` builds in local speech-to-text (sherpa-onnx), so
      # `--transcribe` works with no extra setup: the default ATC model is
      # downloaded on first use.
      - name: Build
        if: ${{ !matrix.windows }}
        run: cargo build --release --features airspy,airspyhf,sherpa
      - name: Build (Windows)
        if: matrix.windows
        run: cargo build --release --features sherpa
      - name: Package zip (Windows)
        if: matrix.windows
        shell: bash
        run: |
          PKG=xng-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/${PKG}
          cp target/release/xng.exe README.md LICENSE-MIT LICENSE-APACHE dist/${PKG}/
          (cd dist && 7z a ${PKG}.zip ${PKG})
          rm -r dist/${PKG}
      - name: Package tarball
        if: ${{ !matrix.windows }}
        run: |
          PKG=xng-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/${PKG}
          cp target/release/xng README.md LICENSE-MIT LICENSE-APACHE dist/${PKG}/
          tar -C dist -czf dist/${PKG}.tar.gz ${PKG}
          rm -r dist/${PKG}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # Desktop app installers, built by the Desktop workflow.
  desktop:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/desktop.yml
    secrets: inherit

  release:
    name: Publish release
    needs: [build, build-linux, verify-linux, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          **xng** is a single native decoder for the radio side of aviation
          and maritime data: ACARS, VDL Mode 2, HFDL, Inmarsat Aero (L/C),
          Inmarsat STD-C/EGC, Iridium (ring alerts, broadcasts, ACARS over
          SBD with wideband burst hunting), AIS, and Mode S/ADS-B — one CLI,
          every output (console, JSON/JSONL, acarsdec-compatible UDP,
          Airframes feeding, Prometheus, asf-2.0 gRPC/QUIC), and a built-in
          application layer (ADS-C, CPDLC rendered as text, media advisory).

          Every decode core is validated against real off-air recordings or
          reference-implementation test vectors, vendored into CI. The VHF
          ACARS chain is validated end-to-end into production Airframes from
          a live station.

          ## Assets

          | Asset | Platform |
          |---|---|
          | `xng-*-x86_64-unknown-linux-gnu.tar.gz` | Linux x86_64 |
          | `xng-*-aarch64-unknown-linux-gnu.tar.gz` | Linux arm64 (Pi 3/4/5 with 64-bit Pi OS) |
          | `xng-*-armv7-unknown-linux-gnueabihf.tar.gz` | Linux armhf (Pi 2/3/4/5 with 32-bit Pi OS) |
          | `xng-*-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon |
          | `xng-*-x86_64-pc-windows-msvc.zip` | Windows x86_64 (radios need [PothosSDR](https://downloads.myriadrf.org/builds/PothosSDR/) installed) |
          | `xng-*-amd64.deb`, `xng-*-arm64.deb`, `xng-*-armhf.deb` | Debian/Ubuntu/Pi OS packages |
          | `xng-desktop-*.deb` | Desktop app, Debian/Ubuntu (x86_64 + arm64) |
          | `xng-desktop-*-aarch64-apple-darwin.dmg` | Desktop app, macOS Apple Silicon |
          | `xng-desktop-*-x86_64-pc-windows-msvc.exe` | Desktop app installer, Windows x86_64 (radios need [PothosSDR](https://downloads.myriadrf.org/builds/PothosSDR/) installed) |

          Windows: the desktop installer is not code-signed yet; choose
          "More info" then "Run anyway" on the SmartScreen prompt. macOS: if
          the app is blocked on first open, allow it under System Settings >
          Privacy & Security > Open Anyway.

          Intel macOS: build from source (GitHub retired its free Intel
          macOS runners) — `brew install soapysdr airspy airspyhf protobuf
          && cargo build --release --features airspy,airspyhf,sherpa`.

          The Linux binaries and .debs run on Ubuntu 22.04 or newer, Debian
          12 or newer and Raspberry Pi OS Bookworm (glibc 2.35+). The armhf
          build needs a Pi 2 or newer (ARMv7); Pi Zero and Pi 1 are not
          supported.

          Binaries are built with SoapySDR plus the native Airspy backends;
          they need `libsoapysdr` (and `libairspy`/`libairspyhf` for native
          Airspy) at runtime — the .deb declares these. Multi-arch Docker
          images (amd64/arm64/armv7) are published to
          `ghcr.io/airframesio/xng` for the same tag.

          Airband transcription works out of the box in the binaries, the
          amd64/arm64 .debs and the amd64/arm64 Docker images: `--transcribe` runs
          sherpa-onnx with the ATC-tuned `skycontrol-atc-110m` model,
          downloaded once (137 MB) on first use. The armv7 image has no local
          engine and neither do the armhf binary and .deb (sherpa-onnx has no
          32-bit ARM build); use `--whisper-url` there.

          Quick start:

          ```bash
          xng devices
          xng scan --sdr driver=rtlsdr --gain 28 --modes acars,vdl2,ais
          xng survey --sdr driver=rtlsdr --mode acars --tune-gain
          xng listen --sdr driver=rtlsdr --mode acars -r 2400000 -c 130.940M \
              --channels 130.025,131.550,131.725 \
              --feed-airframes --station-id XX-YOUR-STATION
          ```
          EOF
      - name: Changelog since previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            git log --pretty='- %s' ${PREV:+$PREV..}"$GITHUB_REF_NAME" \
              | grep -E '\(#[0-9]+\)$' || echo "- (no merged PRs found)"
            echo
            if [ -n "$PREV" ]; then
              echo "Full diff: [\`$PREV...$GITHUB_REF_NAME\`](https://github.com/airframesio/xng/compare/$PREV...$GITHUB_REF_NAME)"
              echo
            fi
            cat notes.md
          } > notes_full.md
          mv notes_full.md notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "xng $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
