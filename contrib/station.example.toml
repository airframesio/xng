# xng station configuration — the whole receive site in one process.
#   xng station station.toml
station-id = "XX-KSEA-1"
# station-uuid = "…"   # the station's UUID on Airframes (keeps its feed when renamed)

[outputs]
feed-airframes = true
jsonl = "/var/log/xng/messages.jsonl"
metrics = "0.0.0.0:9090"
http = "0.0.0.0:8080"          # live web dashboard (map + messages)
# mqtt = "mqtt://user:pass@broker:1883"
# zmq = ["tcp://0.0.0.0:5555"] # ZMQ PUB; [mode, json] frames; one socket fans
                               # out to every listed endpoint. Each binds by
                               # default; prefix connect: to connect instead,
                               # e.g. ["tcp://0.0.0.0:5555", "connect:tcp://collector:5555"]
# sbs = "0.0.0.0:30003"        # Mode S BaseStation TCP
# beast = "0.0.0.0:30005"      # Mode S Beast TCP (mlat-client compatible)
# nmea-tcp = "0.0.0.0:10110"   # AIS NMEA TCP

# Dashboard basemap (optional). Default: OpenFreeMap "dark" — OpenStreetMap
# vector tiles, no API key (openfreemap.org). Styles: dark, positron, bright,
# liberty, fiord. style-url takes any MapLibre style (e.g. a self-hosted
# OpenFreeMap); format = "raster" draws OpenStreetMap raster tiles instead.
# [outputs.map]
# style = "dark"
# style-url = "https://tiles.example.org/styles/dark"
# format = "vector"

# Per-mode Airframes feeding (optional). When omitted, `feed-airframes`
# above governs (ACARS-only, station id used verbatim — the legacy
# behavior). With this block, each supported mode feeds its own Airframes
# ingest in that ingest's native format under its own station id; asf-2.0
# (asf2-grpc/asf2-quic) is fed separately and is unaffected. Ingests:
# ACARS udp 5550, VDL2 udp 5552, HFDL tcp 5556, AIS http 5599, Aero udp
# 5571 (L-band) / 5561 (C-band), Iridium tcp 5590, radiosonde udp 5573
# (auto_rx payload summary JSON). Modes without one
# (STD-C, ADS-B, UAT, ...) feed via asf-2.0.
# [outputs.airframes]
# enabled = true
# station-id = "XX-KSEA"        # base; defaults to the top-level station-id
# auto-suffix = true            # XX-KSEA -> XX-KSEA-ACARS / -VDL2 / -HFDL / -AIS / -IMSL / -IRDM / -SONDE
# [outputs.airframes.hfdl]
# enabled = false               # decode HFDL locally, do not feed it
# [outputs.airframes.aero]      # aero-l and aero-c sessions
# port = 5571

[[session]]
sdr = "driver=rtlsdr,serial=00000001"
gain = 48
mode = "acars"
sample-rate = 2400000
center = "131.000M"
channels = ["130.025", "131.125", "131.550", "131.725"]
# feed = false                          # disable Airframes feed for this decoder
# airframes-station-id = "XX-KSEA-ACARS2"  # override the station id for it
# airframes-station-uuid = "…"             # and that station's UUID

[[session]]
sdr = "driver=airspy"          # rate/center/channels derive from the
mode = "vdl2"                  # mode's built-in plan when omitted

[[session]]
sdr = "driver=rtlsdr,serial=00000002"
mode = "adsb"
sample-rate = 2000000
center = "1090M"
channels = ["1090"]
receiver-pos = "47.62,-122.35" # enables surface-position decode
