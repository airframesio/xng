<title>xng station</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
  :root { color-scheme: dark; --sw: 480px; --eh: 45%; --ch: 170px; }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0e14; color: #c8ccd4; }
  #map { flex: 1; min-width: 0; }
  /* Drag handle between the map and the side panel. */
  #hres { flex: none; width: 6px; cursor: col-resize; background: #1c2230; }
  #hres:hover, #vres:hover { background: #2a2f41; }
  #side { flex: 0 0 var(--sw); display: flex; flex-direction: column; min-width: 280px; }
  #head { padding: 9px 12px; border-bottom: 1px solid #1c2230; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex: none; }
  #head b { color: #7aa2f7; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #head .sub { color: #565f89; font-size: 12px; white-space: nowrap; }
  #head .hr { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  /* Altitude unit picker, styled like the log bar buttons. */
  #altunit { background: #16161e; border: 1px solid #2a2f41; border-radius: 4px; color: #c8ccd4; padding: 1px 4px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer; outline: none; }
  #altunit:hover, #altunit:focus { border-color: #7aa2f7; }
  /* Mode filter chips — sit with the message log they filter. */
  #chips { padding: 7px 10px; border-bottom: 1px solid #1c2230; display: flex; flex-wrap: wrap; gap: 5px; flex: none; }
  .chip { border: 1px solid #2a2f41; border-radius: 10px; padding: 2px 9px; cursor: pointer; user-select: none; display: flex; gap: 6px; align-items: baseline; }
  .chip b { font-weight: 600; }
  .chip .rate { color: #565f89; font-size: 11px; }
  .chip.off { opacity: 0.35; }
  /* Entities table: top pane, resizable height. Grows to fill when the
     log pane is minimized. */
  #entities { flex: 0 0 var(--eh); overflow-y: auto; }
  body.logmin #entities { flex: 1 1 auto; }
  /* Drag handle between the entities table and the log pane. */
  #vres { flex: none; height: 6px; cursor: row-resize; background: #1c2230; }
  body.logmin #vres { display: none; }
  /* Log pane: chips + controls + message stream, bottom of the side. */
  #logpane { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; border-top: 1px solid #1c2230; }
  body.logmin #logpane { flex: none; }
  body.logmin #msgs { display: none; }
  /* Entity-type tabs above the table. */
  #enttabs { flex: 0 0 auto; display: flex; gap: 2px; padding: 2px 4px; background: #0b0e14; border-bottom: 1px solid #1f2335; overflow-x: auto; white-space: nowrap; }
  #enttabs .tab { cursor: pointer; padding: 2px 9px; border-radius: 4px 4px 0 0; color: #565f89; font-size: 12px; }
  #enttabs .tab:hover { background: #16161e; color: #a9b1d6; }
  #enttabs .tab.on { background: #1f2435; color: #7aa2f7; }
  /* Fixed-width entity icon so narrow dingbats line up with wide emoji. */
  .ent-ic { display: inline-block; width: 1.5em; text-align: center; }
  #entities table { width: 100%; border-collapse: collapse; }
  #entities th, #entities td { text-align: left; padding: 2px 8px; white-space: nowrap; }
  #entities th { color: #565f89; position: sticky; top: 0; background: #0b0e14; cursor: default; }
  #entities tr.row { cursor: pointer; }
  #entities tr.row:hover { background: #16161e; }
  #entities tr.row.sel { background: #1f2435; }
  #entities tr.row.sel td:first-child { border-left: 2px solid #7aa2f7; padding-left: 6px; }
  #entities td.age { color: #565f89; }
  #entities tr.msgrow td { color: #aeb6d6; }
  #entities tr.msgrow td.msgcaret { padding-left: 20px; color: #7aa2f7; }
  /* Keep a selected history row's caret aligned with its siblings: the generic
     .sel first-child accent would shrink padding-left and shift the ↳ back. */
  #entities tr.msgrow.sel td.msgcaret { padding-left: 20px; border-left: 0; }
  /* Selected-message detail pane: sits directly below the entities table and
     above the log. The meta grid auto-reflows so it stays readable in a narrow
     side panel (responsive). */
  #entcard { flex: 0 0 var(--ch); overflow-y: auto; background: linear-gradient(180deg, #161b29, #0e1119); padding: 10px 13px 12px; position: relative; }
  #entcard[hidden] { display: none; }
  /* Resize handle for the detail pane (drag its bottom edge), like #vres. */
  #cres { flex: none; height: 6px; cursor: row-resize; background: #1c2230; }
  #cres:hover { background: #2a2f41; }
  #cres[hidden], body.logmin #cres { display: none; }
  #entcard .cardx { position: absolute; top: 7px; right: 11px; cursor: pointer; color: #565f89; font-size: 13px; line-height: 1; }
  #entcard .cardx:hover { color: #c8ccd4; }
  #entcard h3 { margin: 0 24px 8px 0; padding-bottom: 6px; font-size: 13px; color: #7aa2f7; border-bottom: 1px solid #232a3d; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #entcard .badge { background: #1f2435; color: #7dcfff; border: 1px solid #2a3147; border-radius: 4px; padding: 0 6px; font-size: 10px; letter-spacing: 0.04em; }
  #entcard .msgtext { white-space: pre-wrap; word-break: break-word; background: #0b0e14; border: 1px solid #1c2230; border-radius: 5px; padding: 8px 10px; color: #c8ccd4; font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
  #entcard .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 7px 16px; }
  #entcard .meta .k { color: #565f89; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  #entcard .meta .v { color: #c8ccd4; word-break: break-word; }
  .silh, .silh svg { width: 100%; height: 100%; display: block; }
  .silh svg * { fill: currentColor !important; stroke: none !important; }
  .silh svg image { display: none !important; }
  .leaflet-popup-content-wrapper { background: linear-gradient(180deg, #1a1f2e, #13161f); color: #c8ccd4; border: 1px solid #2a3147; border-radius: 8px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 8px 28px rgba(0,0,0,0.6); }
  .leaflet-popup-content { margin: 11px 14px; }
  .leaflet-popup-tip { background: #13161f; border: 1px solid #2a3147; }
  .leaflet-popup-close-button { color: #565f89 !important; padding: 6px 8px 0 0 !important; }
  .leaflet-popup-close-button:hover { color: #c8ccd4 !important; }
  .pp { display: flex; gap: 12px; align-items: flex-start; min-width: 210px; }
  .pp .pic { width: 64px; height: 64px; flex: none; margin-top: 2px; }
  .pp h3 { margin: 0 0 6px; padding-bottom: 5px; font-size: 14px; color: #7aa2f7; border-bottom: 1px solid #232a3d; letter-spacing: 0.02em; }
  .pp table { border-collapse: collapse; }
  .pp td { padding: 1px 10px 1px 0; vertical-align: baseline; }
  .pp td.k { color: #565f89; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; padding-right: 12px; }
  /* Explanatory footnote under a popup card (e.g. the satellite beam note). */
  .note { margin-top: 8px; padding-top: 7px; border-top: 1px solid #232a3d; color: #8b93b3; font-size: 11px; line-height: 1.45; max-width: 260px; }
  /* Selected-satellite detail card: bottom-left over the map, so it never sits
     on top of the beam pattern the selection reveals (unlike a marker popup). */
  #satcard { position: fixed; left: 10px; bottom: 22px; z-index: 1200; max-width: 320px; background: linear-gradient(180deg, #1a1f2e, #13161f); color: #c8ccd4; border: 1px solid #2a3147; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.6); padding: 11px 14px 12px; }
  #satcard[hidden] { display: none; }
  #satcard .cardx { position: absolute; top: 5px; right: 9px; cursor: pointer; color: #565f89; font-size: 13px; line-height: 1; }
  #satcard .cardx:hover { color: #c8ccd4; }
  #msgbar { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #1c2230; align-items: center; }
  #msgbar input { flex: 1; background: #11141c; border: 1px solid #2a2f41; border-radius: 4px; color: #c8ccd4; padding: 3px 8px; font: inherit; outline: none; }
  #msgbar button { background: #16161e; border: 1px solid #2a2f41; border-radius: 4px; color: #c8ccd4; padding: 3px 10px; font: inherit; cursor: pointer; }
  #msgbar button.on { color: #e0af68; border-color: #e0af68; }
  #msgs { flex: 1; overflow-y: auto; padding: 4px 0; }
  .msg { padding: 3px 12px; border-bottom: 1px solid #11141c; white-space: pre-wrap; word-break: break-word; cursor: pointer; }
  .msg:hover { background: #11141c; }
  .msg .meta { color: #565f89; }
  .msg .tag { border-radius: 3px; padding: 0 5px; font-size: 11px; color: #0b0e14; font-weight: 600; }
  .msg pre { margin: 6px 0 2px; padding: 6px 8px; background: #11141c; border: 1px solid #1c2230; border-radius: 4px; overflow-x: auto; font-size: 11px; color: #9aa5ce; cursor: text; }
  .leaflet-container { background: #0b0e14; }
  .lbl { background: #16161e; border: 1px solid #2a2f41; border-radius: 3px; color: #c8ccd4; padding: 1px 4px; font: 11px ui-monospace, monospace; white-space: nowrap; }
  /* Running build, shown dim next to the station name in the header. */
  #head .ver { color: #565f89; font-size: 11px; font-weight: 400; }
  /* Collapsible SDR / receiver status pane (collapsed by default). */
  #sdr { border-bottom: 1px solid #1c2230; flex: none; }
  #sdrhdr { padding: 5px 12px; display: flex; align-items: baseline; gap: 6px; cursor: pointer; user-select: none; color: #8b93b3; }
  #sdrhdr:hover { background: #11141c; }
  #sdrhdr .tw { color: #565f89; width: 1em; display: inline-block; }
  #sdrhdr .sub { color: #565f89; font-size: 11px; }
  #sdrbody { padding: 2px 12px 8px 12px; }
  #sdrbody[hidden] { display: none; }
  #sdrbody table { width: 100%; border-collapse: collapse; }
  #sdrbody td { padding: 1px 8px 1px 0; vertical-align: baseline; white-space: nowrap; }
  #sdrbody td.k { color: #565f89; }
  #sdrbody .sdrhead { color: #73daca; padding-top: 5px; }
  #sdrbody .live { color: #9ece6a; }
  #sdrbody .stale { color: #e0af68; }
  #sdrbody .dead, #sdrbody .none { color: #565f89; }
  /* Compact per-receiver table: one row each, status dot for liveness. */
  #sdrbody table.sdrtab td { padding: 2px 10px 2px 0; }
  #sdrbody .sdrtab th { text-align: left; font-weight: 400; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #565f89; padding: 0 10px 3px 0; }
  #sdrbody .sdrtab td.rx { color: #c8ccd4; }
  #sdrbody .sdrtab td.mode { color: #7dcfff; }
  #sdrbody .sdrtab td.freq { color: #a9b1d6; font-variant-numeric: tabular-nums; }
  #sdrbody .sdrtab td.ch { color: #565f89; }
  #sdrbody .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: #565f89; vertical-align: middle; }
  #sdrbody .dot.live { background: #9ece6a; box-shadow: 0 0 5px #9ece6a88; }
  #sdrbody .dot.stale { background: #e0af68; }
  #sdrbody .dot.dead { background: #f7768e; }
  /* Fixed-width icons so layer-control rows align despite emoji width. */
  .lyr-ic { display: inline-block; width: 1.5em; text-align: center; font-style: normal; }
  .rx-ic { font-size: 17px; text-align: center; line-height: 22px; filter: drop-shadow(0 0 3px #000); }
</style>
</head>
<body>
<div id="map"></div>
<div id="satcard" hidden></div>
<div id="hres" title="Drag to resize"></div>
<div id="side">
  <div id="head"><span><b id="station">xng station</b> <span class="ver" id="ver"></span></span><span class="hr"><span class="sub" id="status"></span><select id="altunit" title="Altitude unit" aria-label="Altitude unit"></select></span></div>
  <div id="sdr">
    <div id="sdrhdr" title="Show receiver / SDR status"><span class="tw" id="sdrtw">▸</span><span>SDR status</span><span class="sub" id="sdrsum"></span></div>
    <div id="sdrbody" hidden></div>
  </div>
  <div id="enttabs"></div>
  <div id="entities"></div>
  <div id="vres" title="Drag to resize"></div>
  <div id="entcard" hidden></div>
  <div id="cres" hidden title="Drag the detail pane's edge to resize"></div>
  <div id="logpane">
    <div id="chips"></div>
    <div id="msgbar">
      <button id="collapse" title="Minimize / restore the message log">▾</button>
      <button id="pause" title="Freeze the message stream">pause</button>
      <input id="search" type="text" placeholder="filter messages…" spellcheck="false">
    </div>
    <div id="msgs"></div>
  </div>
</div>
<script>
// Airband sessions get a link to the listening page.
fetch('/api/airband', { cache: 'no-store' }).then(r => r.json()).then(a => {
  if (!a.channels || !a.channels.length) return;
  const l = document.createElement('a');
  l.href = '/airband'; l.textContent = '🎧 airband';
  l.style.cssText = 'color:#9ece6a;text-decoration:none;margin-left:10px;font-size:12px';
  document.getElementById('head').firstElementChild.appendChild(l);
}).catch(() => {});
</script>

function inRange(code        , codes                               )          {
  return codes.some((c) => (Array.isArray(c) ? code >= c[0] && code <= c[1] : code === c));
}

/** The MMSI as nine digits (numeric MMSIs lose their leading zeros). */
function normalizeMmsi(mmsi                                    )                {
  if (mmsi == null) return null;
  const digits = String(mmsi).trim();
  if (!/^\d{1,9}$/.test(digits)) return null;
  return digits.padStart(9, '0');
}

/** The icon for an MMSI alone, for stations that are not ships (ITU-R M.585). */
function marineIconKeyForMmsi(mmsi                                    )                       {
  const m = normalizeMmsi(mmsi);
  if (!m) return null;
  if (m.startsWith('970')) return 'sart';
  if (m.startsWith('972')) return 'mob';
  if (m.startsWith('974')) return 'epirb';
  if (m.startsWith('111')) return 'sar-aircraft';
  if (m.startsWith('99')) return 'aton';
  if (m.startsWith('98')) return 'class-b'; // craft that belong to a parent ship (tenders, lifeboats)
  if (m.startsWith('00')) return 'base-station';
  return null;
}

function atonKey(aidType                           , virtual                            )                {
  if (virtual) return 'aton-virtual';
  // 1-19 are fixed (reference points, RACONs, structures, lights, beacons); 20-31 float.
  // 4 is an emergency wreck marking buoy, so it floats.
  if (aidType != null && aidType >= 1 && aidType <= 19 && aidType !== 4) return 'aton-fixed';
  return 'aton';
}

/** The icon key for an AIS target. Never throws; unknown targets get 'unknown'. */
function marineIconKey(target              )                {
  const byMmsi = marineIconKeyForMmsi(target.mmsi);
  const raw = target.type == null ? '' : String(target.type).trim();
  const lower = raw.toLowerCase();

  // Aids to navigation: by message 21 fields, our "aton:" type, or MMSI.
  // Explicit aid fields win over the stored form, which wins over type text.
  if (
    target.messageType === 21 ||
    target.aidType != null ||
    target.virtual === true ||
    lower.startsWith('aton') ||
    byMmsi === 'aton'
  ) {
    let aid = target.aidType ?? null;
    let virtual = target.virtual ?? null;
    if (lower.startsWith('aton')) {
      const parts = lower.split(':');
      const n = Number(parts[1]);
      if (aid == null && Number.isFinite(n) && parts[1] !== '') aid = n;
      if (virtual == null) virtual = parts.includes('virtual');
    } else if (virtual == null && lower.includes('virtual')) {
      virtual = true;
    }

    if (aid == null && !virtual && raw !== '' && !lower.startsWith('aton')) {
      for (const [name, key] of NAME_INDEX) if (key === 'aton-fixed' && lower.includes(name)) return 'aton-fixed';
    }
    return atonKey(aid, virtual);
  }

  if (target.messageType === 9) return 'sar-aircraft';
  if (byMmsi && byMmsi !== 'class-b') return byMmsi;

  if (raw !== '') {
    const code = /^\d+$/.test(raw) ? Number(raw) : NaN;
    if (Number.isFinite(code) && code > 0) {
      for (const icon of MARINE_ICON_LIST) if (icon.codes.length && inRange(code, icon.codes)) return icon.key;
    } else if (!Number.isFinite(code)) {
      // Longest name first, so "lightship" wins over "light" and "sart" over "sar".
      for (const [name, key] of NAME_INDEX) {
        if (!lower.includes(name)) continue;
        if ((key === 'aton' || key === 'aton-fixed') && lower.includes('virtual')) return 'aton-virtual';

      }
    }

  return 'unknown';
}

/** True when the map should turn the icon by the target's course or heading. */
function marineIconRotates(key               )          {
  return MARINE_ICONS[key].rotate;
}

const NAME_INDEX                            = MARINE_ICON_LIST.flatMap((icon) =>
  icon.names.map((name) => [name, icon.key]                           ),
).sort((a, b) => b[0].length - a[0].length);

/** A data URL for an icon, for <img> or a map's image loader. */
function marineIconDataUrl(key               )         {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(MARINE_ICONS[key].svg);
}

/**
 * Loads every icon as an image of `size` CSS pixels at `pixelRatio`, for
 * map.addImage() in MapLibre or Mapbox GL. Resolves to [key, image] pairs.
 */
async function loadMarineIconImages(
  size = 32,
  pixelRatio = 2,
)                                        {
  const px = Math.round(size * pixelRatio);
  return Promise.all(
    MARINE_ICON_LIST.map(
      (icon) =>
        new Promise                            ((resolve, reject) => {
          const img = new Image(px, px);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = px;
            canvas.height = px;
            const ctx = canvas.getContext('2d');
            if (!ctx) return reject(new Error('no 2d context'));
            ctx.drawImage(img, 0, 0, px, px);
            resolve([icon.key, ctx.getImageData(0, 0, px, px)]);
          };
          img.onerror = () => reject(new Error(`marine icon ${icon.key} failed to load`));
          img.src = marineIconDataUrl(icon.key);
        }),
    ),
  );
}

/**
 * Relative icon size (1 = a typical 100 m ship), for `icon-size` or a pixel
 * size. Ships with a reported length (AIS dimensions to bow + to stern, in
 * meters) are sized by it; others use their type's size.
 */
function marineIconScale(key               , lengthMeters                )         {
  const icon = MARINE_ICONS[key];
  if (icon?.rotate && key !== 'sar-aircraft' && lengthMeters != null && lengthMeters > 2 && lengthMeters < 600) {
    return Math.min(1.4, Math.max(0.55, 0.25 + 0.4 * Math.log10(lengthMeters)));
  }
  return icon?.scale ?? 1;
}

const AIRCRAFT_ICONS = Object.fromEntries(AIRCRAFT_ICON_LIST.map((i) => [i.key, i]))                                         ;

/** What a map knows about an aircraft. Every field is optional. */
                                 
                                                                         
                       
                                                                                           
                           
                                                                                       
                            
 

const Q = 'quad', W = 'widebody', N = 'airliner', R = 'regional', T = 'turboprop', J = 'bizjet', L = 'light', L2 = 'light-twin', H = 'helicopter', F = 'fighter', M = 'military-transport', D = 'drone';

const TYPE_LIST                         = {
  // Narrow-body twins

  // Light singles (piston and single turboprop)
  [L]: 'C150 C152 C162 C170 C172 C175 C177 C180 C182 C185 C195 C206 C207 C208 C210 P210 T206 PA18 PA20 PA22 PA24 PA25 PA28 P28A P28B P28R P28T PA32 P32R PA46 PA38 BE33 BE35 BE36 BE23 BE24 M20P M20T M20J DA20 DA40 DV20 SR20 SR22 S22T TBM7 TBM8 TBM9 PC12 PC6T PC9 PC21 PC7 RV4 RV6 RV7 RV8 RV9 RV10 RV12 AA5 GLAS C77R AT3T AT8T AT5T M600 KODI EPIC CH60 G115 G120 PA36 PA11 J3 CUB2 SR21 EVOT T6',

  [L2]: 'BE55 BE58 BE60 BE76 BE95 BE9L BE9T BE20 BE30 BE35T PA23 PA27 PA30 PA31 PA34 PA44 PA60 P68 C303 C310 C320 C335 C340 C402 C404 C414 C421 C425 C441 DA42 DA62 B350 AC90 AC95 AEST MU2 PAY1 PAY2 PAY3 PAY4 P180 BN2P TWEN',

  [M]: 'C130 C30J HRC1 P3 P3C CP14 C160 C27J G222 E2 C2 KC2 AN22 C12 U21',

  [D]: 'RQ4 MQ9 MQ1 Q4 Q9 TB2 UAV DRON',

  glider: 'GLID',
  airship: 'SHIP BALL',
  ultralight: 'ULAC',

const TYPES                                  = {};
for (const [key, list] of Object.entries(TYPE_LIST)) for (const t of list.split(' ')) TYPES[t] = key                   ;

/** Family prefixes, checked when the exact designator is not listed (longest first). */
const PREFIXES                              = [
  ['B74', 'quad'], ['A34', 'quad'], ['A38', 'quad'],
  ['B73', 'airliner'], ['B3', 'airliner'], ['A31', 'airliner'], ['A32', 'airliner'], ['B75', 'airliner'],
  ['B76', 'widebody'], ['B77', 'widebody'], ['B78', 'widebody'], ['A33', 'widebody'], ['A35', 'widebody'],
  ['CRJ', 'regional'], ['E17', 'regional'], ['E19', 'regional'],
  ['AT', 'turboprop'], ['DH8', 'turboprop'], ['SF', 'turboprop'],
  ['GLF', 'bizjet'], ['GL', 'bizjet'], ['LJ', 'bizjet'], ['FA', 'bizjet'], ['C5', 'bizjet'], ['C6', 'bizjet'], ['C7', 'bizjet'],
  ['EC', 'helicopter'], ['AS3', 'helicopter'], ['AS5', 'helicopter'], ['AS6', 'helicopter'], ['MI', 'helicopter'], ['R4', 'helicopter'], ['R6', 'helicopter'],
  ['PA', 'light'], ['P28', 'light'], ['C1', 'light'], ['C2', 'light'], ['SR', 'light'], ['DA', 'light'], ['RV', 'light'], ['BE3', 'light'],
  ['SU', 'fighter'],
];

const ADSB                                  = {};
for (const i of AIRCRAFT_ICON_LIST) for (const c of i.adsb) ADSB[c] = i.key;

/** ADS-B emitter category as "A3": accepts "a3", "A3", "3" with set "A", or DO-260 numbers like 0xA3. */
function emitterCategory(c                                    )                {
  if (c == null || c === '') return null;
  if (typeof c === 'number') return c >= 0xa0 && c <= 0xdf ? c.toString(16).toUpperCase() : null;
  const s = c.trim().toUpperCase();
  return /^[A-D][0-7]$/.test(s) ? s : null;
}

/** The icon for an aircraft. Never throws; unknown aircraft get the `unknown` icon. */
function aircraftIconKey(target                )                  {
  const t = target.type?.trim().toUpperCase();
  if (t) {
    const exact = TYPES[t];
    if (exact) return exact;
    for (const [p, key] of PREFIXES) if (t.startsWith(p)) return key;
  }
  const cat = ADSB[emitterCategory(target.category) ?? ''];
  if (cat) return target.military && (cat === 'airliner' || cat === 'widebody') ? 'military-transport' : cat;
  return target.military ? 'fighter' : 'unknown';
}

/** What a map knows about a balloon flight. */
                                
                                                     
                               
                                                                                    
                          
 

/** The icon for a radiosonde or high-altitude balloon: rising, falling or landed. */
function balloonIconKey(target               )                  {
  if (target.landed) return 'landed';
  if (target.verticalRate != null && target.verticalRate < -1) return 'parachute';
  return 'balloon';
}

/** True when the map should turn the icon by track or heading (it points north). */
function aircraftIconRotates(key                 )          {
  return AIRCRAFT_ICONS[key]?.rotate ?? false;
}

/** Relative icon size (1 = a narrow-body airliner), for `icon-size` or a pixel size. */
function aircraftIconScale(key                 )         {
  return AIRCRAFT_ICONS[key]?.scale ?? 1;
}

/** Darkens a #rrggbb color, for an outline that matches a custom fill. */
function darkenColor(hex        , amount = 0.5)         {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!m) return '#222222';
  const n = parseInt(m[1], 16);
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * (1 - amount)).toString(16).padStart(2, '0')).join('');
}

/**
 * The icon's SVG. Aircraft take a fill color (by altitude, basemap, ...) and an
 * outline, which defaults to a darker shade of the fill. Balloon icons keep
 * their own colors.
 */
function aircraftIconSvg(key                 , fill                , stroke                )         {
  const icon = AIRCRAFT_ICONS[key] ?? AIRCRAFT_ICONS.unknown;
  if (!fill || icon.balloon) return icon.svg;
  return icon.template.split('{{fill}}').join(fill).split('{{stroke}}').join(stroke || darkenColor(fill));
}

/** The icon as a data: URL, for <img> and Leaflet. */
function aircraftIconDataUrl(key                 , fill                , stroke                )         {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(aircraftIconSvg(key, fill, stroke));
}

/**
 * Renders icons to ImageData for MapLibre/Mapbox `map.addImage(id, data, { pixelRatio })`.
 * `fill` recolors the aircraft (balloons keep their colors). Browser only.
 */
async function loadAircraftIconImages(
  options                                                                                                   = {},
)                                          {
  const { size = 32, pixelRatio = 2, fill, stroke } = options;
  const px = Math.round(size * pixelRatio);
  const keys = options.keys ?? AIRCRAFT_ICON_LIST.map((i) => i.key);
  return Promise.all(
    keys.map(
      (key) =>
        new Promise                              ((resolve, reject) => {
          const img = new Image(px, px);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = px;
            canvas.height = px;
            const ctx = canvas.getContext('2d');
            if (!ctx) return reject(new Error('no 2d context'));
            ctx.drawImage(img, 0, 0, px, px);
            resolve([key, ctx.getImageData(0, 0, px, px)]);
          };
          img.onerror = () => reject(new Error(`could not draw ${key}`));
          img.src = aircraftIconDataUrl(key, fill, stroke);
        }),
    ),
  );
}
return { AIRCRAFT_ICONS, aircraftIconKey, aircraftIconSvg, aircraftIconScale, aircraftIconRotates, balloonIconKey };
})();

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([40, -95], 4);
map.attributionControl.addAttribution('silhouettes &copy; <a href="https://github.com/plane-watch/pw-silhouettes">Plane Watch</a>');

// Basemap. /map/config.json names a MapLibre style (OpenFreeMap by default:
// OpenStreetMap vector tiles, no API key) or asks for raster. The vector map
// renders with MapLibre beneath the Leaflet overlays; OpenStreetMap raster
// tiles are the fallback (no WebGL, or the style or MapLibre fails to load).
(function basemap() {
  const OSM = { tiles: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19 };
  const raster = fb => L.tileLayer(fb.tiles, { attribution: fb.attribution, maxZoom: fb.maxZoom }).addTo(map);
  const webgl = () => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } };
  const asset = (tag, url, sri) => new Promise((ok, err) => {
    const el = document.createElement(tag);
    if (tag === 'link') { el.rel = 'stylesheet'; el.href = url; } else { el.src = url; }
    el.integrity = sri; el.crossOrigin = 'anonymous'; el.onload = ok; el.onerror = err;
    document.head.appendChild(el);
  });
  fetch('/map/config.json').then(r => r.json()).catch(() => ({ format: 'raster', fallback: OSM })).then(cfg => {
    const fallback = cfg.fallback || OSM;
    if (cfg.format !== 'vector' || !webgl()) return raster(fallback);
    Promise.all([
      asset('link', 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css', 'sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V'),
      asset('script', 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js', 'sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj'),
    ])
      .then(() => asset('script', 'https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js', 'sha384-4CB9Vtol9LN6lGgBCvmPLbUEZwilrqIvPieSRurgAXAB7FVJaLS9n8WyAIA5wjQ+'))
      // Fetch the style here so a failure falls back to raster instead of
      // leaving an empty map.
      .then(() => fetch(cfg.style).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
      .then(style => {
        // A style passed as an object has lost its URL, so resolve relative
        // resource URLs against it here. new URL() percent-encodes the
        // {z}/{fontstack}-style template braces; put them back.
        const abs = u => /^[a-z][a-z\d+.-]*:/i.test(u) ? u
          : new URL(u, cfg.style).href.replace(/%7B/gi, '{').replace(/%7D/gi, '}');
        if (typeof style.sprite === 'string') style.sprite = abs(style.sprite);
        else if (Array.isArray(style.sprite)) style.sprite.forEach(s => { if (s && typeof s.url === 'string') s.url = abs(s.url); });
        if (typeof style.glyphs === 'string') style.glyphs = abs(style.glyphs);
        for (const src of Object.values(style.sources || {})) {
          if (typeof src.url === 'string') src.url = abs(src.url);
          if (Array.isArray(src.tiles)) src.tiles = src.tiles.map(abs);
        }
        const layer = L.maplibreGL({ style, attribution: cfg.attribution }).addTo(map);
        // Fall back to raster if the vector map can't come up: any error
        // before it first loads, or a whole source failing later. Individual
        // tile errors are transient and left to MapLibre.
        const gl = layer.getMaplibreMap();
        // Tile errors (network, 5xx) only count until a tile has loaded, so a
        // dead tile host falls back but a stray failure later doesn't. MapLibre
        // treats tile 404s as empty tiles and reports nothing for them.
        let loaded = false, fellBack = false, tileLoaded = false, tileErrors = 0;
        gl.once('load', () => { loaded = true; });
        gl.on('sourcedata', e => { if (e.tile) tileLoaded = true; });
        gl.on('error', e => {
          if (fellBack || (loaded && !e.sourceId && !e.tile)) return;
          if (e.tile && (tileLoaded || ++tileErrors < 3)) return;
          fellBack = true;
          map.removeLayer(layer);
          raster(fallback);
        });
      })
      .catch(() => raster(fallback));
  });
})();

// Entity markers live in per-class layer groups so the layer control can
// toggle Flights / Ships / Beacons. Visible by default.
const flightLayer = L.layerGroup().addTo(map);
const shipLayer = L.layerGroup().addTo(map);
const beaconLayer = L.layerGroup().addTo(map);
const meshLayer = L.layerGroup().addTo(map);
// "Show All Trails": by default a position trail is drawn only for the
// selected entity; this toggle reveals every entity's trail. Backed by an
// (otherwise empty) group so it lives in the Leaflet layer control — the real
// work is the showAllTrails flag read in upsert().
const trailLayer = L.layerGroup();
let showAllTrails = localStorage.getItem('xng.trails') === '1';

// Optional Iridium overlays: satellite positions + the targeted ring/beam
// ground footprints (cf. iridium-toolkit live-map). Added to the control only
// when Iridium is running. Kept out of the aircraft/vessel auto-fit so global
// satellite positions never yank the view.
const satLayer = L.layerGroup();
const ringLayer = L.layerGroup();
// Beam pattern: the full reconstructed 48-cell pattern projected under each
// tracked satellite (off by default — a denser power-user view).
const patternLayer = L.layerGroup();
// Mobile terminals: Iridium customer devices (vessels/aircraft/handhelds)
// that report their own position — distinct from the beam footprints.
const deviceLayer = L.layerGroup();
// "Beam pattern" (the toggle) means show ALL satellites' patterns; selecting a
// satellite overrides it to show only that one. `patternShowAll` tracks the
// checkbox intent; `patternForcing` marks our own programmatic add/remove (when
// a pin reveals a pattern) so it isn't mistaken for a user toggle.
let patternShowAll = localStorage.getItem('xng.patternLayer') === '1';
let patternForcing = false;

// Build the layer control ONCE, after the first snapshot, with only the
// overlays relevant to the modes that are actually running (or already
// producing data) — so e.g. the four Iridium layers never appear unless an
// Iridium session exists.
let layerControlBuilt = false;
function buildLayerControl(s) {
  if (layerControlBuilt) return;
  const modes = new Set((s.sessions || []).map(x => x.mode).filter(Boolean));
  const any = (...ms) => ms.some(m => modes.has(m));
  const overlays = {};
  if (any('acars', 'vdl2', 'hfdl', 'aero', 'aero-c', 'adsb', 'uat') || (s.aircraft || []).length)
    overlays['<i class="lyr-ic">✈</i>Flights'] = flightLayer;
  if (any('ais') || (s.vessels || []).length)
    overlays['<i class="lyr-ic">🚢</i>Ships'] = shipLayer;
  if (any('sonde', 'ads-l', 'adsl', 'sarsat', 'dsc', 'navtex') || (s.beacons || []).length)
    overlays['<i class="lyr-ic">📡</i>Beacons'] = beaconLayer;
  if (any('meshtastic', 'meshcore') || (s.mesh_nodes || []).length)
    overlays['<i class="lyr-ic">📶</i>Mesh nodes'] = meshLayer;
  const irid = any('iridium') || (s.iridium_sats || []).length
    || (s.iridium_rings || []).length || (s.iridium_devices || []).length;
  if (irid) {
    overlays['<i class="lyr-ic">🛰</i>Iridium satellites'] = satLayer;
    overlays['<i class="lyr-ic">◎</i>Spot beams'] = ringLayer;
    overlays['<i class="lyr-ic">⬡</i>Beam pattern'] = patternLayer;
    overlays['<i class="lyr-ic">📟</i>Iridium terminals'] = deviceLayer;
    if (localStorage.getItem('xng.satLayer') !== '0') satLayer.addTo(map);
    if (localStorage.getItem('xng.ringLayer') !== '0') ringLayer.addTo(map);
    if (localStorage.getItem('xng.deviceLayer') !== '0') deviceLayer.addTo(map);
    if (patternShowAll) patternLayer.addTo(map);
  }
  overlays['<i class="lyr-ic">〰</i>Show All Trails'] = trailLayer;
  if (showAllTrails) trailLayer.addTo(map);
  L.control.layers(null, overlays, { position: 'topright', collapsed: false }).addTo(map);
  layerControlBuilt = true;
}

// Pin the receiver/station location on the map when any session reports a
// receiver-pos (from the `receiver-pos` config). One marker, updated in place.
let receiverMarker = null;
function renderReceiver(s) {
  const sess = (s.sessions || []).find(x => Array.isArray(x.receiver_pos) && x.receiver_pos.length === 2);
  if (!sess) { if (receiverMarker) { map.removeLayer(receiverMarker); receiverMarker = null; } return; }
  const [lat, lon] = sess.receiver_pos;
  if (receiverMarker) { receiverMarker.setLatLng([lat, lon]); return; }
  const icon = L.divIcon({ className: 'rx-ic', html: '📡', iconSize: [22, 22], iconAnchor: [11, 11] });
  receiverMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000, interactive: true })
    .addTo(map)
    .bindTooltip(`Receiver ${lat.toFixed(4)}, ${lon.toFixed(4)}`, { direction: 'top', className: 'lbl' });
}

// Receiver location estimated from Iridium ring-alert Doppler (no GPS): a
// marker plus a circle, wide while provisional. Shown beside a configured
// receiver position too, as a cross-check.
let rxEstMarker = null, rxEstCircle = null;
function renderReceiverEstimate(s) {
  const e = s.receiver_estimate;
  if (!e || e.lat == null) {
    if (rxEstMarker) { map.removeLayer(rxEstMarker); map.removeLayer(rxEstCircle); rxEstMarker = rxEstCircle = null; }
    return;
  }
  const ll = [e.lat, e.lon];
  const color = e.settled ? '#9ece6a' : '#e0af68';
  const radius = e.settled ? 5000 : Math.max(20000, (e.moved_km || 50) * 1000);
  const tip = `Receiver estimate from Iridium Doppler<br>${e.lat.toFixed(4)}, ${e.lon.toFixed(4)}` +
    `<br>${e.settled ? 'Settled' : 'Provisional'}: ${e.measurements} ring alerts of ${e.satellites} satellites, ${e.rms_hz} Hz rms` +
    (e.moved_km != null ? `<br>${e.moved_km} km from the previous fit` : '') +
    `<br>Receiver offset ${e.offset_hz} Hz`;
  if (!rxEstMarker) {
    const icon = L.divIcon({ className: 'rx-ic', html: '🛰️', iconSize: [22, 22], iconAnchor: [11, 11] });
    rxEstCircle = L.circle(ll, { radius, color, weight: 1, dashArray: '4,4', fillOpacity: 0.06 }).addTo(map);
    rxEstMarker = L.marker(ll, { icon, zIndexOffset: 900 }).addTo(map)
      .bindTooltip('', { direction: 'top', className: 'lbl' });
  }
  rxEstMarker.setLatLng(ll).setTooltipContent(tip);
  rxEstCircle.setLatLng(ll).setRadius(radius).setStyle({ color });
}

map.on('overlayadd overlayremove', e => {

const SIL_BASE = 'https://cdn.jsdelivr.net/gh/plane-watch/pw-silhouettes@2daabf1a862710e9360ecb05c95111822f346dc5';

// Reduce a fetched SVG to inert geometry: parse, reject non-SVG,

function sanitizeSvg(text) {

  root.querySelectorAll('script,foreignObject,image,use,animate,set,animateTransform,animateMotion')
    .forEach(el => el.remove());

    for (const at of [...el.attributes]) {

function silhouette(type) {

      if (j.aliasOf) j = await (await fetch(`${SIL_BASE}/airframes/${j.aliasOf}.json`)).json();

// Sync the optional Iridium layers from the state snapshot. Satellite

// cull, and never contribute to the auto-fit bounds.

// Clicking an entity opens its per-source breakdown (one row per contributing
// source). Keyed by the stable master id so the open state survives poll
// re-renders. Entities table sort state — default: most recently seen first.
const acExpanded = new Set();
let sortCol = 'seen', sortDir = 'desc';
// Active entities-table tab ('all' or an entity type). Persisted.
let entTab = localStorage.getItem('xng.enttab') || 'all';
// ONE delegated click handler for the entities table (rows AND sortable column
// headers). Rows carry their identity in escaped data-* attributes (read back
// via dataset, never re-parsed as HTML/JS), so attacker-controlled fields
// (ACARS tail/flight, AIS name) can't break out of an inline handler — XSS-safe.
// Attached once; survives the innerHTML re-render (it lives on the container).
document.getElementById('entities').addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (th) {
    const col = th.dataset.col;
    if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortCol = col; sortDir = (col === 'seen' || col === 'msgs' || col === 'alt' || col === 'kt') ? 'desc' : 'asc'; }
    render();
    return;
  }
  const tr = e.target.closest('tr');
  if (!tr || !tr.dataset) return;
  if (tr.dataset.act === 'term') { window.toggleTerminals(); return; }
  if (tr.dataset.msgkey) {
    // A history sub-row: open that message's detail pane (no map nav).
    const m = msgIndex[tr.dataset.msgkey];
    if (m) { selectedMsg = { ...m, mk: tr.dataset.msgkey }; render(); }
    return;
  }
  const k = tr.dataset.k;
  if (!k) return;
  if (tr.dataset.exp === '1') {
    const id = tr.dataset.id || '';
    acExpanded.has(id) ? acExpanded.delete(id) : acExpanded.add(id);
  }
  // A pager row: open its latest message in the detail pane (render() below
  // re-renders the card). Single-message pagers have no history sub-rows, so
  // the row itself is the way in.
  if (entMsg[k]) selectedMsg = entMsg[k];
  const lat = tr.dataset.lat ? parseFloat(tr.dataset.lat) : null;
  const lon = tr.dataset.lon ? parseFloat(tr.dataset.lon) : null;
  selectEntity(k, lat, lon);
});
// Entity-type tabs: switching resets the sort to "most recently seen" so the
// new tab's columns are always a valid sort key.
document.getElementById('enttabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  entTab = t.dataset.tab;
  localStorage.setItem('xng.enttab', entTab);
  sortCol = 'seen'; sortDir = 'desc';
  render();
});
document.getElementById('pause').onclick = function () {
  paused = !paused;
  this.classList.toggle('on', paused);
  this.textContent = paused ? 'resume' : 'pause';
  render();
};
document.getElementById('search').oninput = () => render();

// Minimize / restore the message-log pane (the entities table takes
// the freed space). Leaflet must recompute the map size after any
// layout change.
const collapseBtn = document.getElementById('collapse');
function setLogMin(min) {
  document.body.classList.toggle('logmin', min);
  collapseBtn.textContent = min ? '▸' : '▾';
  collapseBtn.classList.toggle('on', min);
  localStorage.setItem('xng.logmin', min ? '1' : '0');
  setTimeout(() => map.invalidateSize(), 50);
}
collapseBtn.onclick = () => setLogMin(!document.body.classList.contains('logmin'));

// SDR / receiver status pane: collapsed by default, expand state persisted.
function setSdrOpen(open) {
  document.getElementById('sdrbody').hidden = !open;
  document.getElementById('sdrtw').textContent = open ? '▾' : '▸';
  localStorage.setItem('xng.sdr', open ? '1' : '0');
  if (open && state) renderSdr(state);
}
document.getElementById('sdrhdr').onclick = () => setSdrOpen(document.getElementById('sdrbody').hidden);
if (localStorage.getItem('xng.sdr') === '1') setSdrOpen(true);

// Draggable pane sizes, persisted. The horizontal handle resizes the
// side panel width; the vertical handle resizes the entities/log split.
function restore(key, varName) {
  const v = localStorage.getItem(key);
  if (v) document.documentElement.style.setProperty(varName, v);
}
restore('xng.sw', '--sw');
restore('xng.eh', '--eh');
restore('xng.ch', '--ch');
if (localStorage.getItem('xng.logmin') === '1') setLogMin(true);

function drag(handle, onMove) {
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    document.body.style.userSelect = 'none';
    const move = ev => onMove(ev);
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.body.style.userSelect = '';
      map.invalidateSize();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
drag(document.getElementById('hres'), ev => {
  const w = Math.min(Math.max(window.innerWidth - ev.clientX, 280), window.innerWidth - 200);
  document.documentElement.style.setProperty('--sw', w + 'px');
  localStorage.setItem('xng.sw', w + 'px');
});
drag(document.getElementById('vres'), ev => {
  const side = document.getElementById('side').getBoundingClientRect();
  const top = document.getElementById('entities').getBoundingClientRect().top;
  const h = Math.min(Math.max(ev.clientY - top, 60), side.bottom - top - 80);
  const pct = (h / side.height * 100).toFixed(1) + '%';
  document.documentElement.style.setProperty('--eh', pct);
  localStorage.setItem('xng.eh', pct);
});
// Detail pane height: drag its bottom edge (#cres). logpane (flex:1) absorbs
// the delta, so the entcard top stays put and only its height changes.
drag(document.getElementById('cres'), ev => {
  const side = document.getElementById('side').getBoundingClientRect();
  const top = document.getElementById('entcard').getBoundingClientRect().top;
  const h = Math.min(Math.max(ev.clientY - top, 70), side.bottom - top - 80);
  document.documentElement.style.setProperty('--ch', h + 'px');
  localStorage.setItem('xng.ch', h + 'px');
});

function upsert(key, lat, lon, icon, label, popup, trail, color, layer) {
  if (lat == null || lon == null) return null;
  let e = markers.get(key);
  if (!e) {
    e = { marker: L.marker([lat, lon], { icon }).addTo(layer), layer };
    e.marker.bindTooltip(label, { permanent: true, direction: 'right', offset: [10, 0], className: 'lbl' });
    e.marker.bindPopup(popup);
    // Clicking the marker selects the entity (highlights its row).
    e.marker.on('popupopen', () => {
      if (selected !== key) {
        selected = key;
        render();
        const row = document.querySelector(`#entities tr[data-k="${key}"]`);
        if (row) row.scrollIntoView({ block: 'nearest' });
      }
    });
    markers.set(key, e);
  } else {
    e.marker.setLatLng([lat, lon]);
    e.marker.setIcon(icon);
    e.marker.setTooltipContent(label);
    e.marker.setPopupContent(popup);
  }
  // Trail shows only for the selected entity, or for everything when "Show All
  // Trails" is on. Drawn on the map directly (not the entity's layer group) so
  // it tracks selection independently; removed when neither condition holds.
  const wantTrail = (showAllTrails || selected === key) && trail && trail.length > 1;
  if (wantTrail) {
    // Unwrap longitudes around the current position so a trail crossing the
    // ±180° antimeridian draws continuously instead of streaking across the
    // whole map (same fix the Iridium satellite trails already use).
    const tr = unwrapTrail(trail, lon);
    if (e.trail) e.trail.setLatLngs(tr);
    else e.trail = L.polyline(tr, { color, weight: 1.5, opacity: 0.6 }).addTo(map);
  } else if (e.trail) {
    map.removeLayer(e.trail);
    e.trail = null;
  }
  e.alive = true;
  return [lat, lon];
}

function fmtAge(s) {
  if (s == null) return '';
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m`;
}
// Structured popup card: optional silhouette + key/value rows (values
// are pre-escaped by the caller; empty rows are dropped).
function entityPopup(pic, title, kv) {
  const rows = kv
    .filter(([, v]) => v != null && v !== false && v !== '')
    .map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`)
    .join('');
  return `<div class="pp">${pic ? `<div class="pic">${pic}</div>` : ''}` +
    `<div><h3>${title}</h3><table>${rows}</table></div></div>`;
}
// Per-message detail pane below the entities table. Shows the full text of a
// selected pager message plus its metadata; the meta grid is responsive. All
// values are escaped here — msgIndex holds raw strings, never HTML.
function renderEntCard() {
  const el = document.getElementById('entcard');
  if (!el) return;
  const cres = document.getElementById('cres');
  const m = selectedMsg;
  if (!m) { el.hidden = true; el.innerHTML = ''; if (cres) cres.hidden = true; return; }
  if (cres) cres.hidden = false;
  const proto = String(m.proto || '').toUpperCase();
  const now = (state && state.now) || 0;
  const recv = m.seen ? new Date(m.seen * 1000).toLocaleString() : '';
  const meta = [
    ['capcode', m.cap], ['protocol', proto], ['kind', m.kind || ''],
    ['class', m.cls || ''], ['function', m.fn], ['baud', m.baud],
    ['received', recv], ['age', m.seen ? fmtAge(now - m.seen) : ''],
  ].filter(([, v]) => v != null && v !== '');
  const text = String(m.text || '');
  el.innerHTML =
    `<span class="cardx" title="Close" onclick="clearMsg()">✕</span>` +
    `<h3><span class="ent-ic">📟</span>${escapeHtml(String(m.cap))}` +
    (proto ? ` <span class="badge">${escapeHtml(proto)}</span>` : '') + `</h3>` +
    `<div class="msgtext">${text ? escapeHtml(text) : '<span style="color:#565f89">(no text)</span>'}</div>` +
    `<div class="meta">` +
    meta.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${escapeHtml(String(v))}</div></div>`).join('') +
    `</div>`;
  el.hidden = false;
}
function fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h${String(m).padStart(2, '0')}m` : `${m}m`;
}

// SDR / receiver status pane. The collapsed header always shows a one-line
// summary; the body (built only when expanded) lists each session's SDR,
// mode, tuning and per-mode liveness from last_seen.
function renderSdr(s) {
  const sess = s.sessions || [];
  const n = sess.length;
  document.getElementById('sdrsum').textContent =
    n ? `${n} receiver${n > 1 ? 's' : ''} · ${[...new Set(sess.map(x => x.mode).filter(Boolean))].join(', ')}` : 'none';
  const body = document.getElementById('sdrbody');
  if (body.hidden) return; // skip the table build while collapsed
  if (!n) { body.innerHTML = '<span class="sub">no active receivers</span>'; return; }
  // Compact: one row per receiver (rx · mode · freq · channels · liveness)
  // instead of a tall key/value block per SDR. A status dot encodes liveness.
  const rows = sess.map(se => {
    const mode = se.mode || '';
    const seen = (s.last_seen || {})[mode];
    const age = seen != null ? s.now - seen : null;
    const cls = age == null ? 'none' : (age < 30 ? 'live' : (age < 120 ? 'stale' : 'dead'));
    const last = age == null ? 'no msgs' : `${fmtAge(age)} ago`;
    const ch = Array.isArray(se.channels) ? se.channels.length : (se.channels || 1);
    const serial = se.serial ? String(se.serial) : (se.sdr || '').replace(/^.*serial=/, '') || '?';
    const freq = se.center_mhz != null ? (+se.center_mhz).toFixed(3) : '';
    const rate = se.sample_rate ? `${(se.sample_rate / 1e6).toFixed(1)} MS/s` : '';
    const tip = escapeHtml([se.sdr, rate, freq && `${freq} MHz`].filter(Boolean).join(' · '));
    return `<tr title="${tip}">` +
      `<td class="rx"><span class="dot ${cls}"></span>${escapeHtml(serial)}</td>` +
      `<td class="mode">${escapeHtml(mode)}</td>` +
      `<td class="freq">${freq}</td>` +
      `<td class="ch">${ch}ch</td>` +
      `<td class="${cls}">${last}</td></tr>`;
  }).join('');
  body.innerHTML = `<table class="sdrtab">` +
    `<tr class="sdrhdr-row"><th>rx</th><th>mode</th><th>freq MHz</th><th>ch</th><th>last msg</th></tr>` +
    `${rows}</table>`;
}

// msgs/min per mode over the last 60 s of samples.
function rates() {
  const now = Date.now();
  while (rateHist.length && now - rateHist[0][0] > 65000) rateHist.shift();
  if (rateHist.length < 2) return {};
  const [t0, a] = rateHist[0], [t1, b] = rateHist[rateHist.length - 1];
  const dt = (t1 - t0) / 60000;
  if (dt <= 0) return {};
  const r = {};
  for (const m of Object.keys(b)) r[m] = ((b[m] || 0) - (a[m] || 0)) / dt;
  return r;
}

async function tick() {
  try {
    const r = await fetch('/api/state');
    state = await r.json();
    rateHist.push([Date.now(), { ...state.totals }]);
    render();
  } catch (e) { /* server restarting; retry */ }
}

function render() {
  const s = state;
  if (!s) return;
  buildLayerControl(s); // builds once, with only the relevant overlays
  renderReceiver(s);    // pin the station location if receiver-pos is configured
  markers.forEach(e => e.alive = false);
  const pts = [];

  for (const a of s.aircraft) {
    // Callsigns arrive over RF: escape before any HTML context.
    // ACARS-only aircraft (positions from ADS-C or military reports) have
    // no ICAO address: key and label them by their entity id instead.
    const label = escapeHtml(a.callsign || a.flight || a.icao || a.reg || a.id);
    const sil = silhouette(a.actype);
    const popup = entityPopup(
      sil ? silDiv(sil, altColor(a.alt), a.trk) : '',
      label,
      [
        ['icao', a.icao && escapeHtml(a.icao)],
        ['reg', a.reg && escapeHtml(a.reg)],
        ['type', a.actype && escapeHtml(a.actype)],
        ['country', a.country && escapeHtml(a.country)],
        ['military', a.military ? (a.mil_kind ? `yes (${escapeHtml(a.mil_kind)})` : 'yes') : null],
        ['mission', a.mission && escapeHtml(a.mission)],
        ['route', (a.dep || a.arr) ? `${escapeHtml(a.dep || '?')} &rarr; ${escapeHtml(a.arr || '?')}` : null],
        ['altitude', a.alt != null ? fmtAlt(a.alt) : null],
        ['speed', a.spd != null ? `${a.spd} kt` : null],
        ['track', a.trk != null ? `${a.trk}&deg;` : null],
        ['squawk', a.squawk && escapeHtml(String(a.squawk))],
        ['sel alt', a.sel_alt != null ? fmtAlt(a.sel_alt) : null],
        ['ADS-B', a.adsb_version != null ? `v${a.adsb_version}` : null],
        ['NACp/SIL', (a.nacp != null || a.sil != null) ? `${a.nacp ?? '-'} / ${a.sil ?? '-'}` : null],
        ['wind/OAT', (a.wind_kt != null || a.oat_c != null)
          ? `${a.wind_kt != null ? a.wind_kt + ' kt' : ''}${a.wind_kt != null && a.oat_c != null ? ', ' : ''}${a.oat_c != null ? a.oat_c + '&deg;C' : ''}` : null],
        ['ACAS RA', a.acas_ra ? 'ACTIVE' : null],
        ['EMERGENCY', a.emergency ? escapeHtml(String(a.emergency)) : null],
        ['msgs', a.msgs],
        ['seen', `${fmtAge(s.now - a.seen)} ago`],
      ]);
    const p = upsert('a' + (a.icao || a.id), a.lat, a.lon, planeIcon(a), label, popup, a.trail, altColor(a.alt), flightLayer);
    if (p) pts.push(p);
  }
  for (const v of s.vessels) {
    const label = escapeHtml((v.name || String(v.mmsi)).trim());
    const sm = vesselMeta(v);
    const popup = entityPopup('', label, [
      ['mmsi', v.mmsi],
      ['country', v.country && escapeHtml(v.country)],
      ['class', sm.label ? (v.shiptype ? `${sm.label} (${v.shiptype})` : sm.label) : null],
      ['speed', v.sog != null ? `${v.sog} kt` : null],
      ['course', v.cog != null ? `${v.cog}&deg;` : null],
      ['type', v.type != null ? `msg ${v.type}` : null],
      ['DISTRESS', v.distress && escapeHtml(String(v.distress))],
      ['seen', `${fmtAge(s.now - v.seen)} ago`],
    ]);
    const p = upsert('v' + v.mmsi, v.lat, v.lon, shipIcon(v), label, popup, v.trail, sm.color, shipLayer);
    if (p) pts.push(p);
  }
  for (const b of (s.beacons || [])) {
    const label = escapeHtml(String(b.id || b.mode || ''));
    const popup = entityPopup('', label, [
      ['mode', escapeHtml(String(b.mode || ''))],
      ['id', escapeHtml(String(b.id || ''))],
      ['altitude', b.alt != null ? fmtAlt(mToFt(b.alt), true) : null],
      ['msgs', b.msgs],
      ['seen', `${fmtAge(s.now - b.seen)} ago`],
    ]);
    const emoji = BEACON_EMOJI[b.mode] || '📡';
    const icon = b.mode === 'sonde' || b.mode === 'ads-l' ? beaconIcon(b)
      : L.divIcon({ className: 'beacon-ic', html: emoji, iconSize: [16, 16] });
    const p = upsert('b' + b.mode + ':' + b.id, b.lat, b.lon, icon, `${emoji} ${label}`, popup, b.trail, '#e0af68', beaconLayer);
    if (p) pts.push(p);
  }
  for (const n of (s.mesh_nodes || [])) {
    if (n.lat == null || n.lon == null) continue;
    const label = escapeHtml(String(n.name || n.short || n.id || ''));
    const popup = entityPopup('', label, [
      ['network', n.proto === 'meshcore' ? 'MeshCore' : 'Meshtastic'],
      ['node', escapeHtml(String(n.id || ''))],
      ['hardware', n.hw && escapeHtml(String(n.hw))],
      ['battery', n.batt != null ? escapeHtml(String(n.batt)) + '%' : null],
      ['altitude', n.alt != null ? fmtAlt(mToFt(n.alt), true) : null],
      ['SNR', n.snr != null ? escapeHtml(String(n.snr)) + ' dB' : null],
      ['last text', n.text && escapeHtml(String(n.text).slice(0, 80))],
      ['msgs', n.msgs],
      ['seen', `${fmtAge(s.now - n.seen)} ago`],
    ]);
    const color = n.proto === 'meshcore' ? '#f7768e' : '#67ea94';
    // A colored dot (an emoji can't take the network's color).
    const icon = L.divIcon({ className: 'mesh-ic', iconSize: [14, 14],
      html: `<span style="display:block;width:10px;height:10px;margin:2px;border-radius:50%;background:${color};box-shadow:0 0 0 2px #0b0e14,0 0 6px ${color}"></span>` });
    const p = upsert('m' + n.proto + ':' + n.id, n.lat, n.lon, icon, label, popup, n.trail, color, meshLayer);
    if (p) pts.push(p);
  }
  markers.forEach((e, k) => {
    if (!e.alive) {
      (e.layer || map).removeLayer(e.marker);
      if (e.trail) map.removeLayer(e.trail);
      markers.delete(k);
    }
  });
  syncIridium(s);
  renderReceiverEstimate(s);
  if (!fitted && pts.length) { map.fitBounds(pts, { maxZoom: 9, padding: [40, 40] }); fitted = true; }

  if (s.station) document.getElementById('station').textContent = s.station;
  document.getElementById('ver').textContent = s.version ? 'xng v' + s.version : '';
  const nsat = (s.iridium_sats || []).length;
  document.getElementById('status').textContent =
    `up ${fmtUptime(s.now - s.started)} · ${s.aircraft.length} aircraft · ${s.vessels.length} vessels` +
    (nsat ? ` · ${nsat} sats` : '') +
    (s.receiver_estimate ? ` · rx ${s.receiver_estimate.lat.toFixed(3)}, ${s.receiver_estimate.lon.toFixed(3)}` +
      (s.receiver_estimate.settled ? '' : ' (provisional)') : '');
  renderSdr(s);

  const rate = rates();
  document.getElementById('chips').innerHTML = Object.entries(s.totals)
    .sort()
    .map(([m, n]) => {
      const c = modeColor(m);
      const rt = rate[m] != null && rate[m] >= 0.05 ? `<span class="rate">${rate[m].toFixed(rate[m] < 10 ? 1 : 0)}/min</span>` : '';
      return `<span class="chip${hiddenModes.has(m) ? ' off' : ''}" onclick="toggleMode('${escapeHtml(m)}')" ` +
        `style="border-color:${c}"><span style="color:${c}">${escapeHtml(m)}</span> <b>${n}</b>${rt}</span>`;
    })
    .join('');

  // Unified entity list. Each ent carries: `type` (for the tab filter), the
  // generic "All" cells (`sv` for sorting, `cols` precomposed), and a per-type
  // field map `f` for the type-specific tab columns. Icons sit in a
  // fixed-width span so narrow text dingbats (✈ ⚓) align with wide emoji
  // (📟 🚆 🎈) — otherwise the rows look ragged.
  const ic = g => `<span class="ent-ic">${g}</span>`;
  const ents = [];
  for (const a of s.aircraft) {
    const id = a.id || a.icao || a.reg || a.flight || '';
    const srcs = a.sources ? Object.values(a.sources) : [];
    ents.push({
      k: 'a' + id, id, type: 'aircraft', mil: !!a.military, lat: a.lat ?? null, lon: a.lon ?? null, srcs, expandable: srcs.length >= 1,
      color: altColor(a.alt), name: `${ic(a.military ? '🎖️' : '✈️')}${escapeHtml(a.flight || a.reg || a.icao || id)}`, seen: a.seen,
      sv: { id, flight: a.flight || '', icao: a.icao || '', reg: a.reg || '', type: a.actype || '', alt: a.alt, kt: a.spd, msgs: a.msgs || 0, seen: a.seen || 0 },
      cols: [escapeHtml(a.flight || ''), escapeHtml(a.icao || ''), escapeHtml(a.reg || ''), escapeHtml(a.actype || ''), fmtAlt(a.alt), a.spd ?? '', a.msgs ?? ''],
      f: { flight: escapeHtml(a.flight || ''), icao: escapeHtml(a.icao || ''), reg: escapeHtml(a.reg || ''), type: escapeHtml(a.actype || ''), alt: fmtAlt(a.alt), kt: a.spd ?? '', msgs: a.msgs ?? '',
        mission: escapeHtml(a.mission || ''), route: (a.dep || a.arr) ? `${escapeHtml(a.dep || '?')} &rarr; ${escapeHtml(a.arr || '?')}` : '', kind: escapeHtml(a.mil_kind || '') },
    });
  }
  for (const v of s.vessels) {
    const m = vesselMeta(v);
    ents.push({
      k: 'v' + v.mmsi, id: String(v.mmsi), type: 'vessel', lat: v.lat ?? null, lon: v.lon ?? null, srcs: [], expandable: false,
      color: m.color, name: `${ic('🚢')}${escapeHtml((v.name || String(v.mmsi)).trim())}`, seen: v.seen,
      sv: { id: v.name || String(v.mmsi), flight: '', icao: '', reg: v.country || '', type: m.label || '', alt: undefined, kt: v.sog, msgs: undefined, seen: v.seen || 0 },
      cols: ['', '', escapeHtml(v.country || ''), escapeHtml(m.label || ''), '', v.sog ?? '', ''],
      f: { mmsi: v.mmsi, country: escapeHtml(v.country || ''), type: escapeHtml(m.label || ''), kt: v.sog ?? '', msgs: v.msgs ?? '' },
    });
  }
  for (const sat of (s.iridium_sats || [])) {
    const nm = sat.name || ('Iridium ' + sat.sat);
    ents.push({
      k: 's' + sat.sat, id: nm, type: 'sat', lat: sat.lat ?? null, lon: sat.lon ?? null, srcs: [], expandable: false,
      color: '#bb9af7', name: `${ic('🛰')}${escapeHtml(nm)}`, seen: sat.seen,
      sv: { id: nm, flight: '', icao: '', reg: '', type: 'satellite', alt: sat.alt, kt: undefined, msgs: undefined, seen: sat.seen || 0 },
      cols: ['', '', '', 'satellite', sat.alt != null ? Math.round(sat.alt) + 'km' : '', '', ''],
      f: { type: 'satellite', alt: sat.alt != null ? Math.round(sat.alt) + 'km' : '' },
    });
  }
  for (const b of (s.beacons || [])) {
    const emoji = BEACON_EMOJI[b.mode] || '📡';
    const ids = String(b.id || '');
    ents.push({
      k: 'b' + b.mode + ':' + b.id, id: ids, type: 'beacon', lat: b.lat ?? null, lon: b.lon ?? null, srcs: [], expandable: false,
      color: '#e0af68', name: `${ic(emoji)}${escapeHtml(ids)}`, seen: b.seen,
      sv: { id: ids, flight: '', icao: '', reg: '', type: b.mode || '', alt: mToFt(b.alt), kt: undefined, msgs: b.msgs, seen: b.seen || 0 },
      cols: ['', '', '', escapeHtml(String(b.mode || '')), fmtAlt(mToFt(b.alt), true), '', b.msgs ?? ''],
      f: { id: escapeHtml(ids), type: escapeHtml(String(b.mode || '')), alt: fmtAlt(mToFt(b.alt), true), msgs: b.msgs ?? '' },
    });
  }
  for (const t of (s.trains || [])) {
    const u = String(t.unit || '');
    ents.push({
      k: 'e' + u, id: u, type: 'train', lat: null, lon: null, srcs: [], expandable: false,
      color: '#9ece6a', name: `${ic('🚆')}${escapeHtml(u)}`, seen: t.seen,
      sv: { id: u, flight: '', icao: '', reg: String(t.kind || ''), type: 'EOT', alt: undefined, kt: undefined, msgs: t.msgs, seen: t.seen || 0 },
      cols: ['', '', escapeHtml(String(t.kind || '')), 'EOT', '', '', t.msgs ?? ''],
      f: { unit: escapeHtml(u), class: escapeHtml(String(t.kind || '')), pressure: t.pressure ?? '', motion: t.motion ?? '', marker: t.marker ?? '', msgs: t.msgs ?? '' },
    });
  }
  for (const p of (s.pagers || [])) {
    const cap = String(p.capcode ?? '');
    const txt = p.text ? String(p.text).trim() : '';
    const hist = p.history || [];
    ents.push({
      k: 'p' + (p.proto || '') + ':' + cap, id: cap, type: 'pager', lat: null, lon: null, srcs: [],
      // Expandable when there's a message history — clicking shows past pages.
      expandable: hist.length > 1, history: hist,
      // Raw pager fields (JS-only, never injected as HTML) for the message detail pane.
      praw: { proto: p.proto, fn: p.function, baud: p.baud, cls: p.class, text: p.text },
      color: '#7dcfff', name: `${ic('📟')}${escapeHtml(cap)}`, seen: p.seen,
      sv: { id: cap, flight: '', icao: '', reg: String(p.proto || ''), type: String(p.class || ''), alt: undefined, kt: undefined, msgs: p.msgs, seen: p.seen || 0 },
      cols: ['', '', escapeHtml(String(p.proto || '')), escapeHtml(String(p.class || '')), '', '', p.msgs ?? ''],
      f: { proto: escapeHtml(String(p.proto || '')), capcode: cap, function: p.function ?? '', baud: p.baud ?? '', text: escapeHtml(txt.slice(0, 48)), msgs: p.msgs ?? '' },
    });
  }
  for (const n of (s.mesh_nodes || [])) {
    const nm = String(n.name || n.short || n.id || '');
    const net = n.proto === 'meshcore' ? 'MeshCore' : 'Meshtastic';
    const color = n.proto === 'meshcore' ? '#f7768e' : '#67ea94';
    const txt = n.text ? String(n.text).trim() : '';
    ents.push({
      k: 'm' + n.proto + ':' + n.id, id: nm, type: 'mesh', lat: n.lat ?? null, lon: n.lon ?? null, srcs: [], expandable: false,
      color, name: `${ic('📶')}${escapeHtml(nm)}`, seen: n.seen,
      sv: { id: nm, flight: '', icao: '', reg: net, type: String(n.hw || ''), alt: mToFt(n.alt), kt: undefined, msgs: n.msgs, seen: n.seen || 0 },
      cols: ['', '', net, escapeHtml(String(n.hw || '')), fmtAlt(mToFt(n.alt), true), '', n.msgs ?? ''],
      f: { net, node: escapeHtml(String(n.id || '')), hw: escapeHtml(String(n.hw || '')), batt: n.batt ?? '', snr: n.snr ?? '', hops: n.hops ?? '',
        text: escapeHtml(txt.slice(0, 48)), msgs: n.msgs ?? '' },
    });
  }
  // --- Entity-type tabs: All (everything, generic columns) + one tab per
  // present type, each with its own column set. Only tabs with ≥1 entity show.
  const TABS = [
    { key: 'all', label: 'All', types: null,
      cols: [['flight', 'flight'], ['icao', 'icao'], ['reg', 'reg'], ['type', 'type'], ['alt', 'alt', 1], ['kt', 'kt', 1], ['msgs', 'msgs', 1]] },
    { key: 'aircraft', label: '✈️ Aircraft', types: ['aircraft'],
      cols: [['flight', 'flight'], ['icao', 'icao'], ['reg', 'reg'], ['type', 'type'], ['alt', 'alt', 1], ['kt', 'kt', 1], ['msgs', 'msgs', 1]] },
    // Military: aircraft in a military ICAO block / flagged by the aircraft
    // DB, or that sent an AMC-style ACARS report (mission number etc.).
    { key: 'military', label: '🎖️ Military', types: ['aircraft'], pred: e => e.mil,
      cols: [['flight', 'callsign'], ['icao', 'icao'], ['reg', 'reg'], ['mission', 'mission'], ['route', 'route'], ['kind', 'last'], ['alt', 'alt', 1], ['msgs', 'msgs', 1]] },
    { key: 'ships', label: '🚢 Ships', types: ['vessel'],
      cols: [['mmsi', 'mmsi', 1], ['country', 'country'], ['type', 'type'], ['kt', 'kt', 1], ['msgs', 'msgs', 1]] },
    { key: 'beacons', label: '🎈 Beacons', types: ['beacon'],
      cols: [['id', 'id'], ['type', 'type'], ['alt', 'alt', 1], ['msgs', 'msgs', 1]] },
    { key: 'trains', label: '🚆 Trains', types: ['train'],
      cols: [['unit', 'unit'], ['class', 'class'], ['pressure', 'psi', 1], ['motion', 'motion', 1], ['marker', 'marker', 1], ['msgs', 'msgs', 1]] },
    { key: 'pagers', label: '📟 Pagers', types: ['pager'],
      cols: [['proto', 'proto'], ['capcode', 'capcode', 1], ['function', 'fn', 1], ['baud', 'baud', 1], ['text', 'text'], ['msgs', 'msgs', 1]] },
    { key: 'mesh', label: '📶 Mesh', types: ['mesh'],
      cols: [['net', 'network'], ['node', 'node'], ['hw', 'type'], ['batt', 'batt %', 1], ['snr', 'snr', 1], ['hops', 'hops', 1], ['text', 'last text'], ['msgs', 'msgs', 1]] },
    { key: 'sats', label: '🛰 Sats', types: ['sat'], cols: [['type', 'type'], ['alt', 'alt']] },
  ];
  const inTab = (t, e) => (!t.types || t.types.includes(e.type)) && (!t.pred || t.pred(e));
  const shownTabs = TABS.filter(t => !t.types || ents.some(e => inTab(t, e)));
  if (!shownTabs.some(t => t.key === entTab)) entTab = 'all';
  const tab = shownTabs.find(t => t.key === entTab) || shownTabs[0];
  const isAll = tab.key === 'all';
  document.getElementById('enttabs').innerHTML = shownTabs.map(t => {
    const n = ents.filter(e => inTab(t, e)).length;
    return `<span class="tab${t.key === entTab ? ' on' : ''}" data-tab="${t.key}">${t.label} ${n}</span>`;
  }).join('');
  const view = ents.filter(e => inTab(tab, e));

  // Sort. `name`/`seen` always valid; otherwise the active tab's column key.
  const colKeys = tab.cols.map(c => c[0]);
  if (sortCol !== 'seen' && sortCol !== 'name' && !colKeys.includes(sortCol)) sortCol = 'seen';
  const NUM = new Set(['alt', 'kt', 'msgs', 'seen', 'pressure', 'baud', 'capcode', 'function', 'motion', 'marker', 'mmsi', 'batt', 'snr', 'hops']);
  const numCol = NUM.has(sortCol);
  const dirMul = sortDir === 'asc' ? 1 : -1;
  const sval = e => sortCol === 'seen' ? (e.seen || 0)
    : sortCol === 'name' ? (e.id || '')
    // Altitude cells are formatted text; sort on the number behind them.
    : ((isAll || sortCol === 'alt') ? e.sv[sortCol] : e.f[sortCol]);
  view.sort((x, y) => {
    let xv = sval(x), yv = sval(y);
    if (numCol) {
      const xn = (xv == null || xv === '') ? null : +xv, yn = (yv == null || yv === '') ? null : +yv;
      if (xn == null && yn == null) return 0;
      if (xn == null) return 1;
      if (yn == null) return -1;
      return (xn - yn) * dirMul;
    }
    xv = (xv ?? '').toString().toLowerCase(); yv = (yv ?? '').toString().toLowerCase();
    if (xv === yv) return 0;
    if (xv === '') return 1;
    if (yv === '') return -1;
    return (xv < yv ? -1 : 1) * dirMul;
  });

  const rows = [];
  msgIndex = {}; entMsg = {}; // rebuilt below as pager rows are emitted
  for (const e of view) {
    // Every pager row is clickable to open its latest message in the detail
    // pane (not just multi-message pagers via their history sub-rows).
    if (e.type === 'pager') {
      const pr = e.praw || {}, h = (e.history && e.history.length) ? e.history[e.history.length - 1] : null;
      const seen = (h && h.seen) || e.seen || 0;
      entMsg[e.k] = {
        cap: e.id, proto: pr.proto, fn: pr.fn, baud: pr.baud, cls: pr.cls,
        kind: h ? h.kind : pr.cls, text: h ? h.text : pr.text, seen,
        mk: e.id + '|' + seen,
      };
    }
    const open = e.expandable && acExpanded.has(e.id);
    const caret = e.expandable ? (open ? '▾ ' : '▸ ') : '';
    const cells = isAll
      ? e.cols.map(c => `<td>${c}</td>`).join('')
      : tab.cols.map(([key]) => `<td>${e.f[key] ?? ''}</td>`).join('');
    rows.push(`<tr class="row${selected === e.k ? ' sel' : ''}" data-k="${escapeHtml(e.k)}" ` +
      `data-id="${escapeHtml(e.id)}" data-lat="${e.lat ?? ''}" data-lon="${e.lon ?? ''}" data-exp="${e.expandable ? 1 : 0}">` +
      `<td style="color:${e.color}">${caret}${e.name}</td>` + cells +
      `<td class="age">${fmtAge(s.now - e.seen)}</td></tr>`);
    if (open && e.type === 'pager' && e.history && e.history.length) {
      // Message history (newest first): each past page as an indented,
      // clickable row that mirrors the parent's columns — the text lands under
      // the "text" column and the age under "seen", so the sub-rows line up.
      const cap = e.id, pr = e.praw || {};
      for (const h of [...e.history].reverse()) {
        const mk = cap + '|' + (h.seen || 0);
        msgIndex[mk] = { cap, proto: pr.proto, fn: pr.fn, baud: pr.baud, cls: pr.cls, kind: h.kind, text: h.text, seen: h.seen };
        const selCls = (selectedMsg && selectedMsg.mk === mk) ? ' sel' : '';
        const txt = escapeHtml(String(h.text || '').slice(0, 80));
        // Middle cells: per-type tab puts text under its 'text' column (blank
        // elsewhere); the All view has no text column, so span its generic cols.
        const mid = isAll
          ? `<td colspan="${e.cols.length}">${txt}</td>`
          : tab.cols.map(([key]) => `<td>${key === 'text' ? txt : ''}</td>`).join('');
        rows.push(`<tr class="row srcrow msgrow${selCls}" data-msgkey="${escapeHtml(mk)}">` +
          `<td class="msgcaret">↳</td>` + mid +
          `<td class="age">${fmtAge(s.now - (h.seen || 0))}</td></tr>`);
      }
    } else if (open && e.srcs.length) {
      // Per-source breakdown. srcs only exist on aircraft, which appear only in
      // the All and Aircraft tabs — both share this 9-cell layout — so the rows
      // line up in either (previously gated to All, leaving Aircraft carets dead).
      for (const sr of [...e.srcs].sort((p, q) => (p.source || '').localeCompare(q.source || ''))) {
        rows.push(`<tr class="row srcrow">` +
          `<td style="padding-left:20px;color:#7aa2f7">↳ ${escapeHtml(sr.source || '')}</td>` +
          `<td>${escapeHtml(sr.flight || '')}</td><td>${escapeHtml(sr.icao || '')}</td>` +
          `<td>${escapeHtml(sr.reg || '')}</td><td>${escapeHtml(sr.type || sr.actype || '')}</td>` +
          `<td>${fmtAlt(sr.alt)}</td><td>${sr.spd ?? ''}</td><td>${sr.msgs ?? ''}</td>` +
          `<td class="age">${sr.seen ? fmtAge(s.now - sr.seen) : ''}</td></tr>`);
      }
    }
  }
  // SBD terminals (Iridium) stay behind their toggle — only in the All view.
  const terms = isAll ? (s.iridium_terminals || []) : [];
  if (terms.length) {
    const ncol = tab.cols.length + 2;
    const showTerm = localStorage.getItem('xng.terminals') === '1';
    rows.push(`<tr class="row" data-act="term">` +
      `<td colspan="${ncol}" style="color:#565f89">📟 ${terms.length} Iridium SBD terminal${terms.length > 1 ? 's' : ''} — click to ${showTerm ? 'hide' : 'show'}</td></tr>`);
    if (showTerm) {
      for (const t of [...terms].sort((x, y) => (y.msgs||0) - (x.msgs||0))) {
        const k = 't' + t.imei;
        rows.push(`<tr class="row${selected === k ? ' sel' : ''}" data-k="${escapeHtml(k)}">` +
          `<td style="color:#e0af68">${ic('📟')}${escapeHtml(t.imei)}</td>` +
          `<td></td><td></td><td></td><td>SBD${t.text ? ' · ' + escapeHtml(String(t.text).trim().slice(0, 20)) : ''}</td>` +
          `<td></td><td></td><td>${t.msgs ?? ''}</td>` +
          `<td class="age">${fmtAge(s.now - t.seen)}</td></tr>`);
      }
    }
  }
  // Sortable headers: name + the active tab's columns + seen.
  const ind = c => sortCol === c ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  const hdr = `<th data-col="name" class="sortable">name${ind('name')}</th>` +
    tab.cols.map(([key, label]) => `<th data-col="${key}" class="sortable">${label}${ind(key)}</th>`).join('') +
    `<th data-col="seen" class="sortable">seen${ind('seen')}</th>`;
  document.getElementById('entities').innerHTML = rows.length
    ? `<table><tr>${hdr}</tr>${rows.join('')}</table>`
    : '';
  renderEntCard();

  // Pause freezes only which log items are listed: capture the live list
  // while running, then always render from the captured list so message
  // details still toggle while paused and resuming catches up to the
  // latest. The map, entities table and chips above keep updating live.
  if (!paused) logMsgs = s.messages;
  const q = document.getElementById('search').value.toLowerCase();
  document.getElementById('msgs').innerHTML = logMsgs
    .filter(m => !hiddenModes.has(m.mode))
    .filter(m => !q || m.text.toLowerCase().includes(q) || m.mode.includes(q))
    .map(m => {
      const c = modeColor(m.mode);
      const det = expanded.has(m.id)
        ? `<pre onclick="event.stopPropagation()">${escapeHtml(JSON.stringify(m.detail, null, 1))}</pre>`
        : '';
      return `<div class="msg" onclick="toggleMsg(${m.id})">` +
        `<span class="meta">${m.t.slice(11, 19)}</span> ` +
        `<span class="tag" style="background:${c}">${escapeHtml(m.mode)}</span> ` +
        `<span class="meta">${(m.freq / 1e6).toFixed(3)}</span> ${escapeHtml(m.text)}${det}</div>`;
    })
    .join('');
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
tick();
setInterval(tick, 2000);

</script>
</body>
</html>
