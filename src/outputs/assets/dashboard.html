<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xng station</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
  :root { color-scheme: dark; --sw: 480px; --eh: 45%; }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0e14; color: #c8ccd4; }
  #map { flex: 1; min-width: 0; }
  /* Drag handle between the map and the side panel. */
  #hres { flex: none; width: 6px; cursor: col-resize; background: #1c2230; }
  #hres:hover, #vres:hover { background: #2a2f41; }
  #side { flex: 0 0 var(--sw); display: flex; flex-direction: column; min-width: 280px; }
  #head { padding: 9px 12px; border-bottom: 1px solid #1c2230; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex: none; }
  #head b { color: #7aa2f7; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #head .sub { color: #565f89; font-size: 12px; white-space: nowrap; }
  /* Mode filter chips — sit with the message log they filter. */
  #chips { padding: 7px 10px; border-bottom: 1px solid #1c2230; display: flex; flex-wrap: wrap; gap: 5px; flex: none; }
  .chip { border: 1px solid #2a2f41; border-radius: 10px; padding: 2px 9px; cursor: pointer; user-select: none; display: flex; gap: 6px; align-items: baseline; }
  .chip b { font-weight: 600; }
  .chip .rate { color: #565f89; font-size: 11px; }
  .chip.off { opacity: 0.35; }
  /* Entities table: top pane, resizable height. Grows to fill when the
     log pane is minimized. */
  #entities { flex: 0 0 var(--eh); overflow-y: auto; }
  body.logmin #entities { flex: 1 1 auto; }
  /* Drag handle between the entities table and the log pane. */
  #vres { flex: none; height: 6px; cursor: row-resize; background: #1c2230; }
  body.logmin #vres { display: none; }
  /* Log pane: chips + controls + message stream, bottom of the side. */
  #logpane { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; border-top: 1px solid #1c2230; }
  body.logmin #logpane { flex: none; }
  body.logmin #msgs { display: none; }
  #entities table { width: 100%; border-collapse: collapse; }
  #entities th, #entities td { text-align: left; padding: 2px 8px; white-space: nowrap; }
  #entities th { color: #565f89; position: sticky; top: 0; background: #0b0e14; cursor: default; }
  #entities tr.row { cursor: pointer; }
  #entities tr.row:hover { background: #16161e; }
  #entities tr.row.sel { background: #1f2435; }
  #entities tr.row.sel td:first-child { border-left: 2px solid #7aa2f7; padding-left: 6px; }
  #entities td.age { color: #565f89; }
  .silh, .silh svg { width: 100%; height: 100%; display: block; }
  .silh svg * { fill: currentColor !important; stroke: none !important; }
  .silh svg image { display: none !important; }
  .leaflet-popup-content-wrapper { background: linear-gradient(180deg, #1a1f2e, #13161f); color: #c8ccd4; border: 1px solid #2a3147; border-radius: 8px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 8px 28px rgba(0,0,0,0.6); }
  .leaflet-popup-content { margin: 11px 14px; }
  .leaflet-popup-tip { background: #13161f; border: 1px solid #2a3147; }
  .leaflet-popup-close-button { color: #565f89 !important; padding: 6px 8px 0 0 !important; }
  .leaflet-popup-close-button:hover { color: #c8ccd4 !important; }
  .pp { display: flex; gap: 12px; align-items: flex-start; min-width: 210px; }
  .pp .pic { width: 64px; height: 64px; flex: none; margin-top: 2px; }
  .pp h3 { margin: 0 0 6px; padding-bottom: 5px; font-size: 14px; color: #7aa2f7; border-bottom: 1px solid #232a3d; letter-spacing: 0.02em; }
  .pp table { border-collapse: collapse; }
  .pp td { padding: 1px 10px 1px 0; vertical-align: baseline; }
  .pp td.k { color: #565f89; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; padding-right: 12px; }
  /* Explanatory footnote under a popup card (e.g. the satellite beam note). */
  .note { margin-top: 8px; padding-top: 7px; border-top: 1px solid #232a3d; color: #8b93b3; font-size: 11px; line-height: 1.45; max-width: 260px; }
  /* Selected-satellite detail card: bottom-left over the map, so it never sits
     on top of the beam pattern the selection reveals (unlike a marker popup). */
  #satcard { position: fixed; left: 10px; bottom: 22px; z-index: 1200; max-width: 320px; background: linear-gradient(180deg, #1a1f2e, #13161f); color: #c8ccd4; border: 1px solid #2a3147; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.6); padding: 11px 14px 12px; }
  #satcard[hidden] { display: none; }
  #satcard .cardx { position: absolute; top: 5px; right: 9px; cursor: pointer; color: #565f89; font-size: 13px; line-height: 1; }
  #satcard .cardx:hover { color: #c8ccd4; }
  #msgbar { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #1c2230; align-items: center; }
  #msgbar input { flex: 1; background: #11141c; border: 1px solid #2a2f41; border-radius: 4px; color: #c8ccd4; padding: 3px 8px; font: inherit; outline: none; }
  #msgbar button { background: #16161e; border: 1px solid #2a2f41; border-radius: 4px; color: #c8ccd4; padding: 3px 10px; font: inherit; cursor: pointer; }
  #msgbar button.on { color: #e0af68; border-color: #e0af68; }
  #msgs { flex: 1; overflow-y: auto; padding: 4px 0; }
  .msg { padding: 3px 12px; border-bottom: 1px solid #11141c; white-space: pre-wrap; word-break: break-word; cursor: pointer; }
  .msg:hover { background: #11141c; }
  .msg .meta { color: #565f89; }
  .msg .tag { border-radius: 3px; padding: 0 5px; font-size: 11px; color: #0b0e14; font-weight: 600; }
  .msg pre { margin: 6px 0 2px; padding: 6px 8px; background: #11141c; border: 1px solid #1c2230; border-radius: 4px; overflow-x: auto; font-size: 11px; color: #9aa5ce; cursor: text; }
  .leaflet-container { background: #0b0e14; }
  .lbl { background: #16161e; border: 1px solid #2a2f41; border-radius: 3px; color: #c8ccd4; padding: 1px 4px; font: 11px ui-monospace, monospace; white-space: nowrap; }
  /* Running build, shown dim next to the station name in the header. */
  #head .ver { color: #565f89; font-size: 11px; font-weight: 400; }
  /* Collapsible SDR / receiver status pane (collapsed by default). */
  #sdr { border-bottom: 1px solid #1c2230; flex: none; }
  #sdrhdr { padding: 5px 12px; display: flex; align-items: baseline; gap: 6px; cursor: pointer; user-select: none; color: #8b93b3; }
  #sdrhdr:hover { background: #11141c; }
  #sdrhdr .tw { color: #565f89; width: 1em; display: inline-block; }
  #sdrhdr .sub { color: #565f89; font-size: 11px; }
  #sdrbody { padding: 2px 12px 8px 12px; }
  #sdrbody[hidden] { display: none; }
  #sdrbody table { width: 100%; border-collapse: collapse; }
  #sdrbody td { padding: 1px 8px 1px 0; vertical-align: baseline; white-space: nowrap; }
  #sdrbody td.k { color: #565f89; }
  #sdrbody .sdrhead { color: #73daca; padding-top: 5px; }
  #sdrbody .live { color: #9ece6a; }
  #sdrbody .stale { color: #e0af68; }
  /* Fixed-width icons so layer-control rows align despite emoji width. */
  .lyr-ic { display: inline-block; width: 1.5em; text-align: center; font-style: normal; }
</style>
</head>
<body>
<div id="map"></div>
<div id="satcard" hidden></div>
<div id="hres" title="Drag to resize"></div>
<div id="side">
  <div id="head"><span><b id="station">xng station</b> <span class="ver" id="ver"></span></span><span class="sub" id="status"></span></div>
  <div id="sdr">
    <div id="sdrhdr" title="Show receiver / SDR status"><span class="tw" id="sdrtw">▸</span><span>SDR status</span><span class="sub" id="sdrsum"></span></div>
    <div id="sdrbody" hidden></div>
  </div>
  <div id="entities"></div>
  <div id="vres" title="Drag to resize"></div>
  <div id="logpane">
    <div id="chips"></div>
    <div id="msgbar">
      <button id="collapse" title="Minimize / restore the message log">▾</button>
      <button id="pause" title="Freeze the message stream">pause</button>
      <input id="search" type="text" placeholder="filter messages…" spellcheck="false">
    </div>
    <div id="msgs"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([40, -95], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap, &copy; CARTO · silhouettes &copy; <a href="https://github.com/plane-watch/pw-silhouettes">Plane Watch</a>', maxZoom: 18,
}).addTo(map);

// Optional Iridium overlays: satellite positions + the targeted ring/beam
// ground footprints (cf. iridium-toolkit live-map). Toggle via the layer
// control; visibility is persisted. Kept out of the aircraft/vessel
// auto-fit so global satellite positions never yank the view.
const satLayer = L.layerGroup();
const ringLayer = L.layerGroup();
// Beam pattern: the full reconstructed 48-cell pattern projected under each
// tracked satellite (off by default — a denser power-user view).
const patternLayer = L.layerGroup();
// Mobile terminals: Iridium customer devices (vessels/aircraft/handhelds)
// that report their own position — distinct from the beam footprints.
const deviceLayer = L.layerGroup();
L.control.layers(null,
  { '<i class="lyr-ic">🛰</i>Iridium satellites': satLayer, '<i class="lyr-ic">◎</i>Spot beams': ringLayer,
    '<i class="lyr-ic">⬡</i>Beam pattern': patternLayer, '<i class="lyr-ic">📟</i>Iridium terminals': deviceLayer },
  { position: 'topright', collapsed: false }).addTo(map);
if (localStorage.getItem('xng.satLayer') !== '0') satLayer.addTo(map);
if (localStorage.getItem('xng.ringLayer') !== '0') ringLayer.addTo(map);
if (localStorage.getItem('xng.deviceLayer') !== '0') deviceLayer.addTo(map);
// "Beam pattern" (the toggle) means show ALL satellites' patterns; selecting a
// satellite overrides it to show only that one. `patternShowAll` tracks the
// checkbox intent; `patternForcing` marks our own programmatic add/remove (when
// a pin reveals a pattern) so it isn't mistaken for a user toggle.
let patternShowAll = localStorage.getItem('xng.patternLayer') === '1';
let patternForcing = false;
if (patternShowAll) patternLayer.addTo(map);
map.on('overlayadd overlayremove', () => {
  if (!patternForcing) { patternShowAll = map.hasLayer(patternLayer); applyPatternFilter(); }
  localStorage.setItem('xng.satLayer', map.hasLayer(satLayer) ? '1' : '0');
  localStorage.setItem('xng.ringLayer', map.hasLayer(ringLayer) ? '1' : '0');
  localStorage.setItem('xng.patternLayer', patternShowAll ? '1' : '0');
  localStorage.setItem('xng.deviceLayer', map.hasLayer(deviceLayer) ? '1' : '0');
});
const satMarkers = new Map();  // sat id -> {marker, trail}
const ringMarkers = new Map(); // "sat-beam" -> coverage-cell L.circle
const patternMarkers = new Map(); // "sat-i" -> projected pattern cell (with _sat)
const cellByBeam = new Map(); // "sat-beam" -> decoded pattern cell marker (spot-beam link)
const deviceMarkers = new Map(); // "lat,lon" -> terminal marker
let pinnedSat = null; // satellite whose pattern stays highlighted (click)
let spotLink = null; // "sat-beam" of a clicked spot beam, linked to its cell
let linkLine = null; // connector polyline from a spot beam to its pattern cell

// Link a clicked spot beam (a measured boresight point) to its beam in the
// pattern: brighten that cell and draw a dotted connector to it. Re-run each
// tick (the pattern cells are rebuilt) so the highlight + line persist.
function renderLink() {
  if (linkLine) { map.removeLayer(linkLine); linkLine = null; }
  if (!spotLink) return;
  const ring = ringMarkers.get(spotLink);
  const cell = cellByBeam.get(spotLink);
  if (!ring || !cell || !patternLayer.hasLayer(cell)) return; // only if the cell is shown
  cell.setStyle({ weight: 3, opacity: 1, fillOpacity: 0.4 });
  const cc = cell.getBounds().getCenter();
  linkLine = L.polyline([ring._ll, [cc.lat, cc.lng]],
    { color: '#fff', weight: 1.5, opacity: 0.8, dashArray: '4 5', interactive: false }).addTo(map);
}

// Beam-pattern visibility: a pinned (clicked) satellite shows only its own
// pattern; with nothing pinned, the "Beam pattern" toggle shows all or none.
function patternVisible(satId) {
  return pinnedSat !== null ? satId === pinnedSat : patternShowAll;
}
// patternLayer is on the map whenever there is anything to show (a pin or the
// toggle). patternForcing keeps this programmatic toggle from being read back
// as a user checkbox change.
function applyPatternVisibility() {
  const want = pinnedSat !== null || patternShowAll;
  patternForcing = true;
  if (want && !map.hasLayer(patternLayer)) patternLayer.addTo(map);
  else if (!want && map.hasLayer(patternLayer)) map.removeLayer(patternLayer);
  patternForcing = false;
}
// Add/remove each rebuilt cell + footprint per the visible set.
function applyPatternFilter() {
  applyPatternVisibility();
  for (const m of patternMarkers.values()) {
    const show = patternVisible(m._sat);
    if (show && !patternLayer.hasLayer(m)) patternLayer.addLayer(m);
    else if (!show && patternLayer.hasLayer(m)) patternLayer.removeLayer(m);
  }
}
// Select a satellite: pin its pattern (only it shows) and open its detail card.
// Click the same satellite again (or the card's ✕) to deselect.
function pinSat(satId) {
  pinnedSat = (pinnedSat === satId) ? null : satId;
  spotLink = null;
  applyPatternFilter();
  renderLink();
  if (pinnedSat === null) hideSatCard(); else showSatCard(pinnedSat);
}
// Selected-satellite detail card (bottom-left) — replaces the marker popup so
// the details never cover the pattern the click reveals.
function setSatCard(html) {
  const el = document.getElementById('satcard'); if (!el) return;
  el.innerHTML = '<span class="cardx" title="Deselect">✕</span>' + html;
  el.querySelector('.cardx').onclick = () => { if (pinnedSat !== null) pinSat(pinnedSat); };
}
function showSatCard(satId) {
  const e = satMarkers.get(satId); if (e && e.detail) setSatCard(e.detail);
  const el = document.getElementById('satcard'); if (el) el.hidden = false;
}
function hideSatCard() { const el = document.getElementById('satcard'); if (el) el.hidden = true; }

// Aircraft silhouettes: PlaneWatch pw-silhouettes (CC BY-NC-SA 4.0,
// used with permission). Resolved by ICAO type designator via the
// repo's airframes/<TYPE>.json metadata (follows aliasOf), fetched
// once per type and inlined so the fill tracks the altitude color.
// Pinned to a commit (not @main) so upstream changes can't silently
// alter what executes here, and sanitized before injection.
const SIL_BASE = 'https://cdn.jsdelivr.net/gh/plane-watch/pw-silhouettes@2daabf1a862710e9360ecb05c95111822f346dc5';
const silCache = new Map(); // TYPE -> {svg, noRotate} | 'pending' | null

// Reduce a fetched SVG to inert geometry: parse, reject non-SVG,
// strip scriptable/embedding elements and event-handler or
// javascript:/data: URL attributes, then reserialize.
function sanitizeSvg(text) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== 'svg') return null;
  root.querySelectorAll('script,foreignObject,image,use,animate,set,animateTransform,animateMotion')
    .forEach(el => el.remove());
  for (const el of [root, ...root.querySelectorAll('*')]) {
    for (const at of [...el.attributes]) {
      const n = at.name.toLowerCase();
      if (n.startsWith('on') || ((n === 'href' || n === 'xlink:href') && /^\s*(javascript|data):/i.test(at.value))) {
        el.removeAttribute(at.name);
      }
    }
  }
  return new XMLSerializer().serializeToString(root);
}

function silhouette(type) {
  if (!type) return null;
  const t = String(type).toUpperCase().replace(/[^A-Z0-9-]/g, '');
  const v = silCache.get(t);
  if (v !== undefined) return v && v.svg ? v : null;
  silCache.set(t, 'pending');
  (async () => {
    try {
      let j = await (await fetch(`${SIL_BASE}/airframes/${t}.json`)).json();
      if (j.aliasOf) j = await (await fetch(`${SIL_BASE}/airframes/${j.aliasOf}.json`)).json();
      const src = String((((j.art || {}).frames || [])[0] || {}).src || '');
      if (!/^silhouettes\/[A-Za-z0-9_-]+\.svg$/.test(src)) throw new Error('bad src');
      const svg = sanitizeSvg(await (await fetch(`${SIL_BASE}/${src}`)).text());
      if (!svg) throw new Error('no svg');
      silCache.set(t, { svg, noRotate: !!(j.render || {}).noRotate });
    } catch (e) { silCache.set(t, null); }
  })();
  return null;
}
function silDiv(sil, color, rot) {
  const r = sil.noRotate ? 0 : rot || 0;
  return `<div class="silh" style="color:${color};transform:rotate(${r}deg)">${sil.svg}</div>`;
}

const MODE_COLORS = {
  acars: '#e0af68', vdl2: '#7aa2f7', hfdl: '#bb9af7', adsb: '#7dcfff',
  modes: '#7dcfff', ais: '#9ece6a', aero: '#f7768e', stdc: '#ff9e64',
  iridium: '#73daca',
};
const modeColor = m => MODE_COLORS[m] || '#9aa5ce';

// Aircraft color by altitude: warm low, cool high (tar1090-style cue).
function altColor(alt) {
  if (alt == null) return '#7aa2f7';
  const h = 20 + Math.min(Math.max(alt, 0), 42000) / 42000 * 220;
  return `hsl(${h.toFixed(0)},75%,62%)`;
}
const planeIcon = (trk, alt, sil) => sil
  ? L.divIcon({ className: '', html: silDiv(sil, altColor(alt), trk),
      iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -18] })
  : L.divIcon({ className: '', html:
      `<div style="transform:rotate(${trk||0}deg);font-size:18px;color:${altColor(alt)}">&#9650;</div>`,
      iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -12] });
// Vessel category from the AIS ship-type code (ITU-R M.1371): a
// label and a tint. Kept coarse — at marker size colour reads where
// hull-shape detail can't. No suitable open vessel-silhouette set
// exists (unlike PlaneWatch for aircraft), so this is our own art.
function shipMeta(t) {
  if (t == null) return { label: null, color: '#9ece6a' };
  if (t >= 70 && t <= 79) return { label: 'Cargo', color: '#9ece6a' };
  if (t >= 80 && t <= 89) return { label: 'Tanker', color: '#f7768e' };
  if (t >= 60 && t <= 69) return { label: 'Passenger', color: '#7aa2f7' };
  if (t >= 40 && t <= 49) return { label: 'High-speed', color: '#bb9af7' };
  if (t === 30) return { label: 'Fishing', color: '#73daca' };
  if (t === 31 || t === 32 || t === 52) return { label: 'Tug/tow', color: '#e0af68' };
  if (t === 36) return { label: 'Sailing', color: '#7dcfff' };
  if (t === 37) return { label: 'Pleasure', color: '#7dcfff' };
  if (t === 50) return { label: 'Pilot', color: '#ff9e64' };
  if (t === 51 || t === 55) return { label: 'SAR/patrol', color: '#ff9e64' };
  return { label: 'Other', color: '#9ece6a' };
}
// Top-view hull: pointed bow (north), squared stern, rotated by COG.
const shipIcon = (cog, type) => {
  const color = shipMeta(type).color;
  return L.divIcon({ className: '', html:
    `<svg width="16" height="16" viewBox="0 0 24 24" style="transform:rotate(${cog||0}deg)">` +
    `<path d="M12 1 L18 9 L18 20 Q18 23 15 23 L9 23 Q6 23 6 20 L6 9 Z" ` +
    `fill="${color}" stroke="#0b0e14" stroke-width="1.5"/></svg>`,
    iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -10] });
};
const IRIDIUM = '#73daca';
// Beam colour by id (1–48), so a satellite's beams read as a coloured tiling.
const beamColor = b => `hsl(${((b || 0) * 360 / 48) | 0},70%,55%)`;
// Unwrap a trail's longitudes into a continuous run around a reference
// longitude (the satellite's current sub-point), so a ground track crossing
// the ±180° date line draws across the seam (off the edge) instead of
// shooting all the way across the map. Mirrors the backend cell unwrap.
function unwrapTrail(trail, refLon) {
  return trail.map(([la, lo]) => {
    let l = lo;
    while (l - refLon > 180) l -= 360;
    while (l - refLon < -180) l += 360;
    return [la, l];
  });
}
const satIcon = () => L.divIcon({ className: '', html:
  `<div style="font-size:18px;line-height:18px;color:${IRIDIUM};text-shadow:0 0 4px #000">&#128752;</div>`,
  iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -14] });

// Sync the optional Iridium layers from the state snapshot. Satellite
// markers (with a faint ground track) and ring/beam footprint circles
// are managed in their own layer groups, independent of the main marker
// cull, and never contribute to the auto-fit bounds.
function syncIridium(s) {
  // Tally decoded vs modelled beams per satellite for the detail card.
  const beamStats = new Map();
  for (const c of (s.iridium_beam_cells || [])) {
    const st = beamStats.get(c.sat) || { seen: 0, est: 0 };
    if (c.decoded) st.seen++; else st.est++;
    beamStats.set(c.sat, st);
  }
  const seenSat = new Set();
  for (const sat of (s.iridium_sats || [])) {
    seenSat.add(sat.sat);
    const name = sat.name || ('S' + String(sat.sat).padStart(2, '0'));
    const label = escapeHtml(name);
    const bs = beamStats.get(sat.sat) || { seen: 0, est: 0 };
    // Travel direction from the ground track (latitude trend).
    const tr = sat.trail;
    const heading = (tr && tr.length > 1)
      ? (tr[tr.length - 1][0] >= tr[0][0] ? 'northbound ↑' : 'southbound ↓')
      : null;
    const note = bs.seen
      ? '<div class="note">A single ground station decodes only the beams that sweep ' +
        'over it. Faint cells are the rest of the satellite’s 48-beam pattern, ' +
        'not yet decoded from here.</div>'
      : '';
    const popup = entityPopup('', label, [
      ['satellite', sat.name ? escapeHtml(sat.name) : null],
      ['sat id', sat.sat],
      ['active beam', sat.beam],
      ['position', `${sat.lat.toFixed(2)}, ${sat.lon.toFixed(2)}`],
      ['altitude', sat.alt != null ? `${sat.alt} km` : null],
      ['heading', heading],
      ['beams', bs.seen ? `${bs.seen} of 48 decoded${bs.est ? ` · ${bs.est} modelled` : ''}` : null],
      ['seen', `${fmtAge(s.now - sat.seen)} ago`],
    ]) + note;
    let e = satMarkers.get(sat.sat);
    if (!e) {
      e = { marker: L.marker([sat.lat, sat.lon], { icon: satIcon() }).addTo(satLayer) };
      e.marker.bindTooltip(label, { permanent: true, direction: 'right', offset: [10, 0], className: 'lbl' });
      const sid = sat.sat; // click selects this satellite (shows only its pattern)
      e.marker.on('click', () => pinSat(sid));
      satMarkers.set(sat.sat, e);
    } else {
      e.marker.setLatLng([sat.lat, sat.lon]);
      e.marker.setTooltipContent(label);
    }
    e.detail = popup; // shown in the bottom-left card while this sat is selected
    if (sat.sat === pinnedSat) setSatCard(popup);
    if (sat.trail && sat.trail.length > 1) {
      const tr2 = unwrapTrail(sat.trail, sat.lon); // continuous across the date line
      if (e.trail) e.trail.setLatLngs(tr2);
      else e.trail = L.polyline(tr2, { color: IRIDIUM, weight: 1, opacity: 0.4, dashArray: '3,4' }).addTo(satLayer);
    }
  }
  for (const [k, e] of satMarkers) if (!seenSat.has(k)) {
    satLayer.removeLayer(e.marker);
    if (e.trail) satLayer.removeLayer(e.trail);
    satMarkers.delete(k);
    if (k === pinnedSat) { pinnedSat = null; hideSatCard(); }
  }

  // Spot beams: where a beam's boresight was just spotted illuminating the
  // ground (the live ring-alert footprint centre). A ring-alert is a POINT
  // measurement, so draw it as a labelled dot — the beam's coverage SHAPE is
  // its cell in the beam pattern. Click a dot to highlight that beam in the
  // pattern and draw a connector to it.
  const seenRing = new Set();
  for (const r of (s.iridium_rings || [])) {
    const key = r.sat + '-' + r.beam;
    seenRing.add(key);
    const col = beamColor(r.beam);
    const popup = entityPopup('', escapeHtml(`spot beam S${r.sat}/B${r.beam}`), [
      ['sat id', r.sat],
      ['beam', r.beam],
      ['boresight', `${r.lat.toFixed(2)}, ${r.lon.toFixed(2)}`],
      ['seen', `${fmtAge(s.now - r.seen)} ago`],
      ['', 'click to link to its beam in the pattern'],
    ]);
    let m = ringMarkers.get(key);
    if (!m) {
      m = L.circleMarker([r.lat, r.lon], { radius: 5, color: col, weight: 2, fillColor: col, fillOpacity: 0.6 }).addTo(ringLayer);
      m.bindTooltip(`B${r.beam}`, { permanent: true, direction: 'right', offset: [6, 0], className: 'lbl' });
      m.bindPopup(popup, { offset: [0, -6] });
      m.on('click', () => { if (pinnedSat !== r.sat) pinSat(r.sat); spotLink = spotLink === key ? null : key; renderLink(); });
      ringMarkers.set(key, m);
    } else {
      m.setLatLng([r.lat, r.lon]);
      m.setStyle({ color: col, fillColor: col });
      m.setPopupContent(popup);
    }
    m._ll = [r.lat, r.lon];
  }
  for (const [k, m] of ringMarkers) if (!seenRing.has(k)) {
    ringLayer.removeLayer(m);
    ringMarkers.delete(k);
    if (spotLink === k) spotLink = null;
  }

  // Beam pattern: the full 48-beam canonical pattern (4 concentric tiers)
  // under each tracked satellite, each beam an elliptical footprint polygon
  // sized per tier so neighbours overlap into contiguous coverage. Decoded
  // beams render solid at their measured positions — bright when currently
  // active, muted otherwise; not-yet-decoded slots render faint dashed grey,
  // so the whole intended pattern shows plus exactly what's been heard.
  // Polygons are cheap, so rebuild them each tick rather than diff.
  cellByBeam.clear();
  for (const m of patternMarkers.values()) patternLayer.removeLayer(m);
  patternMarkers.clear();
  (s.iridium_beam_cells || []).forEach((c, i) => {
    if (!c.poly || c.poly.length < 3) return;
    // Three tiers. An ACTIVE beam (a spot beam swept this station within ~30 s)
    // reads in its beam colour; a merely-DECODED beam is a solid, accented grey;
    // a not-yet-decoded canonical slot is a light, muted, dashed grey — the
    // modelled footprint.
    let style;
    if (c.active) {
      const col = beamColor(c.beam);
      style = { color: col, fillColor: col, weight: 2, opacity: 0.95, fillOpacity: 0.32, dashArray: null };
    } else if (c.decoded) {
      style = { color: '#9aa3bd', fillColor: '#9aa3bd', weight: 1, opacity: 0.38, fillOpacity: 0.04, dashArray: null };
    } else {
      style = { color: '#586079', fillColor: '#586079', weight: 1, opacity: 0.09, fillOpacity: 0.005, dashArray: '2 5' };
    }
    const m = L.polygon(c.poly, style); // added to the layer by applyPatternFilter
    m._base = style; m._sat = c.sat;
    m.bindPopup(c.active ? `sat ${c.sat} · beam ${c.beam} · active`
      : c.decoded ? `sat ${c.sat} · beam ${c.beam} · decoded`
      : `sat ${c.sat} · beam not yet decoded (modelled)`, { offset: [0, -4] });
    patternMarkers.set(c.sat + '-' + i, m);
    if (c.decoded) cellByBeam.set(c.sat + '-' + c.beam, m);
  });
  applyPatternFilter(); // show only the selected satellite's cells (or all if toggled)
  renderLink();

  // Iridium mobile terminals: customer devices that reported their own
  // position (the real device locations, vs the beam footprints above).
  const seenDev = new Set();
  for (const dvc of (s.iridium_devices || [])) {
    const key = dvc.lat.toFixed(2) + ',' + dvc.lon.toFixed(2);
    seenDev.add(key);
    const alt = dvc.alt_km || 0;
    const popup = `Iridium terminal<br>${dvc.lat.toFixed(3)}, ${dvc.lon.toFixed(3)}` +
      (alt > 2 ? `<br>alt ~${alt} km` : '') +
      (dvc.msg_type ? `<br>msg ${dvc.msg_type}` : '');
    let m = deviceMarkers.get(key);
    if (!m) {
      m = L.circleMarker([dvc.lat, dvc.lon],
        { radius: 4, color: '#f59e0b', weight: 2, fillColor: '#f59e0b', fillOpacity: 0.7 })
        .addTo(deviceLayer);
      m.bindPopup(popup, { offset: [0, -6] });
      deviceMarkers.set(key, m);
    } else {
      m.setPopupContent(popup);
    }
  }
  for (const [k, m] of deviceMarkers) if (!seenDev.has(k)) {
    deviceLayer.removeLayer(m);
    deviceMarkers.delete(k);
  }
}

const markers = new Map(); // key -> {marker, trail}
let state = null; // latest /api/state snapshot
let fitted = false;
let paused = false;
let logMsgs = []; // log items currently shown; frozen in place while paused
let selected = null; // entity key ('a'+icao / 'v'+mmsi)
const hiddenModes = new Set();
const expanded = new Set();
const rateHist = []; // [t_ms, totals] samples for per-mode rates

function selectEntity(key, lat, lon) {
  selected = key;
  if (lat != null && lon != null) map.setView([lat, lon], Math.max(map.getZoom(), 9));
  const e = markers.get(key);
  if (e) e.marker.openPopup();
  render();
  const row = document.querySelector(`#entities tr[data-k="${key}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
}
window.selectEntity = selectEntity;
window.toggleMode = m => { hiddenModes.has(m) ? hiddenModes.delete(m) : hiddenModes.add(m); render(); };
window.toggleTerminals = () => {
  localStorage.setItem('xng.terminals', localStorage.getItem('xng.terminals') === '1' ? '0' : '1');
  render();
};
window.toggleMsg = id => { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); };
document.getElementById('pause').onclick = function () {
  paused = !paused;
  this.classList.toggle('on', paused);
  this.textContent = paused ? 'resume' : 'pause';
  render();
};
document.getElementById('search').oninput = () => render();

// Minimize / restore the message-log pane (the entities table takes
// the freed space). Leaflet must recompute the map size after any
// layout change.
const collapseBtn = document.getElementById('collapse');
function setLogMin(min) {
  document.body.classList.toggle('logmin', min);
  collapseBtn.textContent = min ? '▸' : '▾';
  collapseBtn.classList.toggle('on', min);
  localStorage.setItem('xng.logmin', min ? '1' : '0');
  setTimeout(() => map.invalidateSize(), 50);
}
collapseBtn.onclick = () => setLogMin(!document.body.classList.contains('logmin'));

// SDR / receiver status pane: collapsed by default, expand state persisted.
function setSdrOpen(open) {
  document.getElementById('sdrbody').hidden = !open;
  document.getElementById('sdrtw').textContent = open ? '▾' : '▸';
  localStorage.setItem('xng.sdr', open ? '1' : '0');
  if (open && state) renderSdr(state);
}
document.getElementById('sdrhdr').onclick = () => setSdrOpen(document.getElementById('sdrbody').hidden);
if (localStorage.getItem('xng.sdr') === '1') setSdrOpen(true);

// Draggable pane sizes, persisted. The horizontal handle resizes the
// side panel width; the vertical handle resizes the entities/log split.
function restore(key, varName) {
  const v = localStorage.getItem(key);
  if (v) document.documentElement.style.setProperty(varName, v);
}
restore('xng.sw', '--sw');
restore('xng.eh', '--eh');
if (localStorage.getItem('xng.logmin') === '1') setLogMin(true);

function drag(handle, onMove) {
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    document.body.style.userSelect = 'none';
    const move = ev => onMove(ev);
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.body.style.userSelect = '';
      map.invalidateSize();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
drag(document.getElementById('hres'), ev => {
  const w = Math.min(Math.max(window.innerWidth - ev.clientX, 280), window.innerWidth - 200);
  document.documentElement.style.setProperty('--sw', w + 'px');
  localStorage.setItem('xng.sw', w + 'px');
});
drag(document.getElementById('vres'), ev => {
  const side = document.getElementById('side').getBoundingClientRect();
  const top = document.getElementById('entities').getBoundingClientRect().top;
  const h = Math.min(Math.max(ev.clientY - top, 60), side.bottom - top - 80);
  const pct = (h / side.height * 100).toFixed(1) + '%';
  document.documentElement.style.setProperty('--eh', pct);
  localStorage.setItem('xng.eh', pct);
});

function upsert(key, lat, lon, icon, label, popup, trail, color) {
  if (lat == null || lon == null) return null;
  let e = markers.get(key);
  if (!e) {
    e = { marker: L.marker([lat, lon], { icon }).addTo(map) };
    e.marker.bindTooltip(label, { permanent: true, direction: 'right', offset: [10, 0], className: 'lbl' });
    e.marker.bindPopup(popup);
    // Clicking the marker selects the entity (highlights its row).
    e.marker.on('popupopen', () => {
      if (selected !== key) {
        selected = key;
        render();
        const row = document.querySelector(`#entities tr[data-k="${key}"]`);
        if (row) row.scrollIntoView({ block: 'nearest' });
      }
    });
    markers.set(key, e);
  } else {
    e.marker.setLatLng([lat, lon]);
    e.marker.setIcon(icon);
    e.marker.setTooltipContent(label);
    e.marker.setPopupContent(popup);
  }
  if (trail && trail.length > 1) {
    if (e.trail) e.trail.setLatLngs(trail);
    else e.trail = L.polyline(trail, { color, weight: 1.5, opacity: 0.6 }).addTo(map);
  }
  e.alive = true;
  return [lat, lon];
}

function fmtAge(s) {
  if (s == null) return '';
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m`;
}
// Structured popup card: optional silhouette + key/value rows (values
// are pre-escaped by the caller; empty rows are dropped).
function entityPopup(pic, title, kv) {
  const rows = kv
    .filter(([, v]) => v != null && v !== false && v !== '')
    .map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`)
    .join('');
  return `<div class="pp">${pic ? `<div class="pic">${pic}</div>` : ''}` +
    `<div><h3>${title}</h3><table>${rows}</table></div></div>`;
}
function fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h${String(m).padStart(2, '0')}m` : `${m}m`;
}

// SDR / receiver status pane. The collapsed header always shows a one-line
// summary; the body (built only when expanded) lists each session's SDR,
// mode, tuning and per-mode liveness from last_seen.
function renderSdr(s) {
  const sess = s.sessions || [];
  const n = sess.length;
  document.getElementById('sdrsum').textContent =
    n ? `${n} receiver${n > 1 ? 's' : ''} · ${[...new Set(sess.map(x => x.mode).filter(Boolean))].join(', ')}` : 'none';
  const body = document.getElementById('sdrbody');
  if (body.hidden) return; // skip the table build while collapsed
  if (!n) { body.innerHTML = '<span class="sub">no active receivers</span>'; return; }
  body.innerHTML = sess.map(se => {
    const mode = se.mode || '';
    const seen = (s.last_seen || {})[mode];
    const age = seen != null ? s.now - seen : null;
    const liveTxt = age == null ? '—'
      : `<span class="${age < 30 ? 'live' : 'stale'}">${fmtAge(age)} ago</span>`;
    const ch = Array.isArray(se.channels) ? se.channels.length : (se.channels || 1);
    const rows = [
      ['mode', escapeHtml(mode)],
      ['center', se.center_mhz != null ? `${(+se.center_mhz).toFixed(3)} MHz` : null],
      ['sample rate', se.sample_rate ? `${(se.sample_rate / 1e6).toFixed(1)} MS/s` : null],
      ['channels', ch],
      ['serial', se.serial ? escapeHtml(String(se.serial)) : null],
      ['last msg', liveTxt],
    ].filter(([, v]) => v != null && v !== '')
      .map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join('');
    return `<table><tr><td class="sdrhead" colspan="2">${escapeHtml(se.sdr || 'SDR')}</td></tr>${rows}</table>`;
  }).join('');
}

// msgs/min per mode over the last 60 s of samples.
function rates() {
  const now = Date.now();
  while (rateHist.length && now - rateHist[0][0] > 65000) rateHist.shift();
  if (rateHist.length < 2) return {};
  const [t0, a] = rateHist[0], [t1, b] = rateHist[rateHist.length - 1];
  const dt = (t1 - t0) / 60000;
  if (dt <= 0) return {};
  const r = {};
  for (const m of Object.keys(b)) r[m] = ((b[m] || 0) - (a[m] || 0)) / dt;
  return r;
}

async function tick() {
  try {
    const r = await fetch('/api/state');
    state = await r.json();
    rateHist.push([Date.now(), { ...state.totals }]);
    render();
  } catch (e) { /* server restarting; retry */ }
}

function render() {
  const s = state;
  if (!s) return;
  markers.forEach(e => e.alive = false);
  const pts = [];

  for (const a of s.aircraft) {
    // Callsigns arrive over RF: escape before any HTML context.
    const label = escapeHtml(a.callsign || a.icao);
    const sil = silhouette(a.actype);
    const popup = entityPopup(
      sil ? silDiv(sil, altColor(a.alt), a.trk) : '',
      label,
      [
        ['icao', escapeHtml(a.icao)],
        ['reg', a.reg && escapeHtml(a.reg)],
        ['type', a.actype && escapeHtml(a.actype)],
        ['country', a.country && escapeHtml(a.country)],
        ['altitude', a.alt != null ? `${a.alt} ft` : null],
        ['speed', a.spd != null ? `${a.spd} kt` : null],
        ['track', a.trk != null ? `${a.trk}&deg;` : null],
        ['squawk', a.squawk && escapeHtml(String(a.squawk))],
        ['sel alt', a.sel_alt != null ? `${a.sel_alt} ft` : null],
        ['ADS-B', a.adsb_version != null ? `v${a.adsb_version}` : null],
        ['NACp/SIL', (a.nacp != null || a.sil != null) ? `${a.nacp ?? '-'} / ${a.sil ?? '-'}` : null],
        ['wind/OAT', (a.wind_kt != null || a.oat_c != null)
          ? `${a.wind_kt != null ? a.wind_kt + ' kt' : ''}${a.wind_kt != null && a.oat_c != null ? ', ' : ''}${a.oat_c != null ? a.oat_c + '&deg;C' : ''}` : null],
        ['ACAS RA', a.acas_ra ? 'ACTIVE' : null],
        ['EMERGENCY', a.emergency ? escapeHtml(String(a.emergency)) : null],
        ['msgs', a.msgs],
        ['seen', `${fmtAge(s.now - a.seen)} ago`],
      ]);
    const p = upsert('a' + a.icao, a.lat, a.lon, planeIcon(a.trk, a.alt, sil), label, popup, a.trail, altColor(a.alt));
    if (p) pts.push(p);
  }
  for (const v of s.vessels) {
    const label = escapeHtml((v.name || String(v.mmsi)).trim());
    const sm = shipMeta(v.shiptype);
    const popup = entityPopup('', label, [
      ['mmsi', v.mmsi],
      ['country', v.country && escapeHtml(v.country)],
      ['class', sm.label ? `${sm.label} (${v.shiptype})` : null],
      ['speed', v.sog != null ? `${v.sog} kt` : null],
      ['course', v.cog != null ? `${v.cog}&deg;` : null],
      ['type', v.type != null ? `msg ${v.type}` : null],
      ['DISTRESS', v.distress && escapeHtml(String(v.distress))],
      ['seen', `${fmtAge(s.now - v.seen)} ago`],
    ]);
    const p = upsert('v' + v.mmsi, v.lat, v.lon, shipIcon(v.cog, v.shiptype), label, popup, v.trail, sm.color);
    if (p) pts.push(p);
  }
  markers.forEach((e, k) => {
    if (!e.alive) {
      map.removeLayer(e.marker);
      if (e.trail) map.removeLayer(e.trail);
      markers.delete(k);
    }
  });
  syncIridium(s);
  if (!fitted && pts.length) { map.fitBounds(pts, { maxZoom: 9, padding: [40, 40] }); fitted = true; }

  if (s.station) document.getElementById('station').textContent = s.station;
  document.getElementById('ver').textContent = s.version ? 'xng v' + s.version : '';
  const nsat = (s.iridium_sats || []).length;
  document.getElementById('status').textContent =
    `up ${fmtUptime(s.now - s.started)} · ${s.aircraft.length} aircraft · ${s.vessels.length} vessels` +
    (nsat ? ` · ${nsat} sats` : '');
  renderSdr(s);

  const rate = rates();
  document.getElementById('chips').innerHTML = Object.entries(s.totals)
    .sort()
    .map(([m, n]) => {
      const c = modeColor(m);
      const rt = rate[m] != null && rate[m] >= 0.05 ? `<span class="rate">${rate[m].toFixed(rate[m] < 10 ? 1 : 0)}/min</span>` : '';
      return `<span class="chip${hiddenModes.has(m) ? ' off' : ''}" onclick="toggleMode('${escapeHtml(m)}')" ` +
        `style="border-color:${c}"><span style="color:${c}">${escapeHtml(m)}</span> <b>${n}</b>${rt}</span>`;
    })
    .join('');

  const rows = [];
  for (const a of [...s.aircraft].sort((x, y) => (y.msgs||0) - (x.msgs||0))) {
    const k = 'a' + a.icao;
    rows.push(`<tr class="row${selected === k ? ' sel' : ''}" data-k="${k}" ` +
      `onclick="selectEntity('${k}',${a.lat ?? 'null'},${a.lon ?? 'null'})">` +
      `<td style="color:${altColor(a.alt)}">✈ ${escapeHtml(a.callsign || a.icao)}</td>` +
      `<td>${escapeHtml(a.reg || '')}</td><td>${escapeHtml(a.actype || '')}</td>` +
      `<td>${a.alt ?? ''}</td><td>${a.spd ?? ''}</td><td>${a.msgs ?? ''}</td>` +
      `<td class="age">${fmtAge(s.now - a.seen)}</td></tr>`);
  }
  for (const v of [...s.vessels].sort((x, y) => (y.mmsi||0) - (x.mmsi||0))) {
    const k = 'v' + v.mmsi;
    rows.push(`<tr class="row${selected === k ? ' sel' : ''}" data-k="${k}" ` +
      `onclick="selectEntity('${k}',${v.lat ?? 'null'},${v.lon ?? 'null'})">` +
      `<td style="color:${shipMeta(v.shiptype).color}">⚓ ${escapeHtml((v.name || String(v.mmsi)).trim())}</td>` +
      `<td>${escapeHtml(v.country || '')}</td><td>${escapeHtml(shipMeta(v.shiptype).label || '')}</td>` +
      `<td></td><td>${v.sog ?? ''}</td><td></td>` +
      `<td class="age">${fmtAge(s.now - v.seen)}</td></tr>`);
  }
  // Iridium satellites (broadcasting overhead) and SBD terminals (identifiable
  // transmitters on the short-burst-data channel) are entities too.
  for (const sat of [...(s.iridium_sats || [])].sort((x, y) => (x.sat||0) - (y.sat||0))) {
    const k = 's' + sat.sat;
    rows.push(`<tr class="row${selected === k ? ' sel' : ''}" data-k="${k}" ` +
      `onclick="selectEntity('${k}',${sat.lat ?? 'null'},${sat.lon ?? 'null'})">` +
      `<td style="color:#bb9af7">🛰 ${escapeHtml(sat.name || ('Iridium ' + sat.sat))}</td>` +
      `<td></td><td>satellite</td>` +
      `<td>${sat.alt != null ? Math.round(sat.alt) + 'km' : ''}</td><td></td><td></td>` +
      `<td class="age">${fmtAge(s.now - sat.seen)}</td></tr>`);
  }
  // SBD terminals are interesting but not immediately useful, so they're
  // collapsed behind a toggle row (state persisted, hidden by default).
  const terms = s.iridium_terminals || [];
  if (terms.length) {
    const showTerm = localStorage.getItem('xng.terminals') === '1';
    rows.push(`<tr class="row" onclick="toggleTerminals()">` +
      `<td colspan="7" style="color:#565f89">📟 ${terms.length} Iridium SBD terminal${terms.length > 1 ? 's' : ''} — click to ${showTerm ? 'hide' : 'show'}</td></tr>`);
    if (showTerm) {
      for (const t of [...terms].sort((x, y) => (y.msgs||0) - (x.msgs||0))) {
        const k = 't' + t.imei;
        rows.push(`<tr class="row${selected === k ? ' sel' : ''}" data-k="${k}" ` +
          `onclick="selectEntity('${k}',null,null)">` +
          `<td style="color:#e0af68">📟 ${escapeHtml(t.imei)}</td>` +
          `<td></td><td>SBD${t.text ? ' · ' + escapeHtml(String(t.text).trim().slice(0, 20)) : ''}</td>` +
          `<td></td><td></td><td>${t.msgs ?? ''}</td>` +
          `<td class="age">${fmtAge(s.now - t.seen)}</td></tr>`);
      }
    }
  }
  document.getElementById('entities').innerHTML = rows.length
    ? `<table><tr><th>id</th><th>reg</th><th>type</th><th>alt</th><th>kt</th><th>msgs</th><th>seen</th></tr>${rows.join('')}</table>`
    : '';

  // Pause freezes only which log items are listed: capture the live list
  // while running, then always render from the captured list so message
  // details still toggle while paused and resuming catches up to the
  // latest. The map, entities table and chips above keep updating live.
  if (!paused) logMsgs = s.messages;
  const q = document.getElementById('search').value.toLowerCase();
  document.getElementById('msgs').innerHTML = logMsgs
    .filter(m => !hiddenModes.has(m.mode))
    .filter(m => !q || m.text.toLowerCase().includes(q) || m.mode.includes(q))
    .map(m => {
      const c = modeColor(m.mode);
      const det = expanded.has(m.id)
        ? `<pre onclick="event.stopPropagation()">${escapeHtml(JSON.stringify(m.detail, null, 1))}</pre>`
        : '';
      return `<div class="msg" onclick="toggleMsg(${m.id})">` +
        `<span class="meta">${m.t.slice(11, 19)}</span> ` +
        `<span class="tag" style="background:${c}">${escapeHtml(m.mode)}</span> ` +
        `<span class="meta">${(m.freq / 1e6).toFixed(3)}</span> ${escapeHtml(m.text)}${det}</div>`;
    })
    .join('');
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
tick();
setInterval(tick, 2000);
</script>
</body>
