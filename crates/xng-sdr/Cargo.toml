[package]
name = "xng-sdr"
description = "SDR capture and IQ replay sources for the xng multi-mode SDR decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# SoapySDR-backed device capture. Requires libSoapySDR development files.
# SoapySDR is the multi-vendor path (and the only path for SDRplay).
soapy = ["dep:soapysdr"]

[dependencies]
num-complex.workspace = true
thiserror.workspace = true
soapysdr = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
