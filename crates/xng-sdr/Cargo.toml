[package]
name = "xng-sdr"
description = "SDR capture and IQ replay sources for the xng multi-mode SDR decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# SoapySDR-backed device capture. Requires libSoapySDR development files.
# SoapySDR is the multi-vendor path (and the only path for SDRplay).
soapy = ["dep:soapysdr"]
# Native Airspy R2/Mini capture via libairspy (no SoapyAirspy module needed).
airspy = []
# Native Airspy HF+ / Discovery capture via libairspyhf.
airspyhf = []

[dependencies]
num-complex.workspace = true
thiserror.workspace = true
soapysdr = { version = "0.4", optional = true }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
